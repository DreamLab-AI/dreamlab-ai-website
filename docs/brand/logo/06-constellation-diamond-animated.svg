<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DreamLab AI mark">
  <title>DreamLab AI mark</title>
  <defs>
    <linearGradient id="cda-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="cda-w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <filter id="cda-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><style>
    .hl{stroke-dasharray:40;stroke-dashoffset:40;animation:hd .7s ease-out forwards}
    .hs{stroke-dasharray:16;stroke-dashoffset:16;animation:hd .6s ease-out forwards}
    .hn{transform-box:fill-box;transform-origin:center;animation:np 3.2s ease-in-out infinite}
    .hc{transform-box:fill-box;transform-origin:center;animation:br 4s ease-in-out infinite}
    @keyframes hd{to{stroke-dashoffset:0}}
    @keyframes np{0%,100%{transform:scale(1);opacity:.8}15%{transform:scale(1.45);opacity:1}30%{transform:scale(1);opacity:.8}}
    @keyframes br{0%,100%{transform:scale(.9) rotate(0deg)}50%{transform:scale(1.12) rotate(90deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
  </style><g filter="url(#cda-glow)">
    <g stroke="url(#cda-d)" stroke-width="3.2" stroke-linecap="round"><line class="hl" style="animation-delay:0s" x1="32" y1="7" x2="57" y2="32"/><line class="hl" style="animation-delay:0.18s" x1="57" y1="32" x2="32" y2="57"/><line class="hl" style="animation-delay:0.36s" x1="32" y1="57" x2="7" y2="32"/><line class="hl" style="animation-delay:0.54s" x1="7" y1="32" x2="32" y2="7"/></g>
    <g stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" opacity=".75"><line class="hs" style="animation-delay:0.8s" x1="32" y1="7" x2="32" y2="21.5"/><line class="hs" style="animation-delay:0.9s" x1="57" y1="32" x2="42.5" y2="32"/><line class="hs" style="animation-delay:1s" x1="32" y1="57" x2="32" y2="42.5"/><line class="hs" style="animation-delay:1.1s" x1="7" y1="32" x2="21.5" y2="32"/></g>
    <path class="hc" d="M32,23.5 L40.5,32 L32,40.5 L23.5,32 Z" fill="url(#cda-d)"/>
    <circle class="hn" style="animation-delay:1.2s" cx="32" cy="7" r="5" fill="#E879F9"/><circle class="hn" style="animation-delay:2s" cx="57" cy="32" r="4" fill="#22D3EE"/><circle class="hn" style="animation-delay:2.8s" cx="32" cy="57" r="4" fill="#E879F9"/><circle class="hn" style="animation-delay:3.6000000000000005s" cx="7" cy="32" r="4" fill="#22D3EE"/>
  </g>
</svg>
