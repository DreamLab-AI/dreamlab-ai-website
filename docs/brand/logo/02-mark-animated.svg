<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DreamLab mark">
  <title>DreamLab mark</title>
  <defs>
    <linearGradient id="mka-g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="mka-w" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
    <filter id="mka-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs><style>
    .edge{stroke-dasharray:40;stroke-dashoffset:40;animation:draw 1.4s ease-out forwards}
    .e1{animation-delay:.15s}.e2{animation-delay:.3s}.e3{animation-delay:.45s}.e9{animation-delay:0s}
    .node{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
    .n1{animation-delay:.4s}.n2{animation-delay:.8s}.n3{animation-delay:1.2s}
    .wisp{stroke-dasharray:60;stroke-dashoffset:60;transform-box:fill-box;transform-origin:0% 100%;
      animation:draw 1.6s .9s ease-out forwards,sway 6s 2.5s ease-in-out infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
    @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
  </style><g filter="url(#mka-glow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path class="bowl" d="M7,37 H57 M10,37 C12,52 22,57 32,57 C42,57 52,52 54,37" stroke="url(#mka-g)" stroke-width="3.5"/>
    <path d="M24,60 H40" stroke="url(#mka-g)" stroke-width="3"/>
    <g stroke="url(#mka-g)" stroke-width="1.6"><line class="edge e0" x1="21" y1="27" x2="29" y2="18"/><line class="edge e1" x1="29" y1="18" x2="38" y2="24"/><line class="edge e2" x1="38" y1="24" x2="46" y2="13"/><line class="edge e3" x1="21" y1="27" x2="38" y2="24"/><line class="edge e9" x1="32" y1="37" x2="21" y2="27"/></g>
    <g fill="#22D3EE" stroke="none"><circle class="node n0" cx="21" cy="27" r="2.8"/><circle class="node n1" cx="29" cy="18" r="2.8"/><circle class="node n2" cx="38" cy="24" r="2.8"/><circle class="node n3" cx="46" cy="13" r="3.4"/></g>
    <path class="wisp" d="M46,13 C51,10 47,7 51,5 C54,3 58,5 56,8" stroke="url(#mka-w)" stroke-width="2.4"/>
  </g>
</svg>
