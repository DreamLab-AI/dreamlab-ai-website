<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="01-git-time-machine-t 01-git-time-machine-d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="01-git-time-machine-t">Git as a time machine</title>
  <desc id="01-git-time-machine-d">A week of commits from Monday's draft to Friday's final; Tuesday's intro is restored into Friday's version, mixing the best of both.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="296" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">GIT · YOUR TIME MACHINE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
    <rect x="32" y="112" width="160" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="112" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Mon</text>
    <text x="112" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">draft v1</text>
    <rect x="216" y="112" width="160" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="296" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Tue</text>
    <text x="296" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">added intro</text>
    <rect x="400" y="112" width="160" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Wed</text>
    <text x="480" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">fixed typos</text>
    <rect x="584" y="112" width="160" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="664" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Thu</text>
    <text x="664" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">major rewrite</text>
    <rect x="768" y="112" width="160" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="848" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Fri</text>
    <text x="848" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">best of both</text>
    <path d="M192,152 L214,152" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M376,152 L398,152" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M560,152 L582,152" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M744,152 L766,152" fill="none" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arr-accent)"/>
    <path d="M664,192 C664,268 296,268 288,196" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="476" y="262" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">restore Tuesday's intro</text>

</svg>
