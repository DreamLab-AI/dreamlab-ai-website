<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="eco-title eco-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="eco-title">AI development ecosystem 2026</title>
  <desc id="eco-desc">Four pillars of the 2026 ecosystem: AI assistants, version control, development environment and cloud services, each with representative tools.</desc>

  <!-- container -->
  <rect x="8" y="8" width="944" height="304" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">AI DEVELOPMENT ECOSYSTEM 2026</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- AI assistants (focal) -->
  <g>
    <rect x="48" y="96" width="200" height="184" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="68" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#F59E0B">AI ASSISTANTS</text>
    <g font-size="14" font-weight="600" fill="#F5F5F5">
      <text x="68" y="160">Claude Code</text>
      <text x="68" y="188">GitHub Copilot</text>
      <text x="68" y="216">Cursor</text>
      <text x="68" y="244">Windsurf</text>
    </g>
  </g>

  <!-- Version control -->
  <g>
    <rect x="268" y="96" width="200" height="184" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="288" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#9CA3AF">VERSION CONTROL</text>
    <g font-size="14" font-weight="600" fill="#F5F5F5">
      <text x="288" y="160">Git (local)</text>
      <text x="288" y="188">GitHub (remote)</text>
      <text x="288" y="216">GitHub Actions</text>
      <text x="288" y="244">Codespaces</text>
    </g>
  </g>

  <!-- Dev environment -->
  <g>
    <rect x="488" y="96" width="200" height="184" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="508" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#9CA3AF">DEV ENVIRONMENT</text>
    <g font-size="14" font-weight="600" fill="#F5F5F5">
      <text x="508" y="160">VS Code</text>
      <text x="508" y="188">WSL2 (Windows)</text>
      <text x="508" y="216">Dev Containers</text>
      <text x="508" y="244">Extensions</text>
    </g>
  </g>

  <!-- Cloud services -->
  <g>
    <rect x="708" y="96" width="200" height="184" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="728" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#9CA3AF">CLOUD SERVICES</text>
    <g font-size="14" font-weight="600" fill="#F5F5F5">
      <text x="728" y="160">GitHub Pages</text>
      <text x="728" y="188">Vercel · Netlify</text>
      <text x="728" y="216">Cloudflare Pages</text>
      <text x="728" y="244">Custom domains</text>
    </g>
  </g>
</svg>
