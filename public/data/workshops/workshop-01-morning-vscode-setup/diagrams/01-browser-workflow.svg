<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="d01b-title d01b-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d01b-title">Traditional browser-based AI workflow</title>
  <desc id="d01b-desc">Sequence: you type a question in the browser, the browser sends the prompt to the AI, the response comes back, and you copy and paste it into your work by hand — context is lost at every step.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="384" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">TRADITIONAL AI USAGE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- actor chips -->
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">
    <rect x="80" y="96" width="128" height="44" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="124">You</text>
    <rect x="304" y="96" width="128" height="44" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="124">Browser</text>
    <rect x="528" y="96" width="128" height="44" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="124">AI</text>
    <rect x="752" y="96" width="128" height="44" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="816" y="124">Your Work</text>
  </g>

  <!-- lifelines -->
  <g stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3">
    <line x1="144" y1="140" x2="144" y2="316"/>
    <line x1="368" y1="140" x2="368" y2="316"/>
    <line x1="592" y1="140" x2="592" y2="316"/>
    <line x1="816" y1="140" x2="816" y2="316"/>
  </g>

  <!-- messages -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <line x1="144" y1="176" x2="360" y2="176" marker-end="url(#arr)"/>
    <line x1="368" y1="216" x2="584" y2="216" marker-end="url(#arr)"/>
    <line x1="592" y1="256" x2="376" y2="256" marker-end="url(#arr)"/>
    <line x1="144" y1="296" x2="808" y2="296" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">
    <text x="256" y="168">type question</text>
    <text x="480" y="208">send prompt</text>
    <text x="484" y="248">response</text>
    <text x="476" y="288">copy · paste · edit by hand</text>
  </g>

  <text x="480" y="352" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">context lost — manual round trip every time</text>
</svg>
