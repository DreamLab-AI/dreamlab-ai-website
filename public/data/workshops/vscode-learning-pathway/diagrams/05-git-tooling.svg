<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Git tooling in VS Code</title>
  <desc id="dg-desc">Three layers of Git tooling: the built-in Source Control view, the GitLens extension, and Git Graph for visual history.</desc>
  <rect x="8" y="8" width="944" height="280" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">GIT TOOLING IN VS CODE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="272" height="144" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="184" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Source Control View</text>
    <text x="184" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">BUILT IN</text>
    <text x="184" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">stage · commit · branches</text>
    <text x="184" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">diff view · sync</text>

    <rect x="344" y="104" width="272" height="144" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="140" font-size="15" font-weight="600" fill="#F5F5F5">GitLens</text>
    <text x="480" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#F59E0B">EXTENSION</text>
    <text x="480" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">blame · file history</text>
    <text x="480" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">compare · repo insights</text>

    <rect x="640" y="104" width="272" height="144" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="776" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Git Graph</text>
    <text x="776" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">EXTENSION</text>
    <text x="776" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">visual history</text>
    <text x="776" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">branch management</text>
  </g>
</svg>
