<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">How VS Code tunnels work</title>
  <desc id="dg-desc">Your machine creates a tunnel to the VS Code relay; a remote browser or VS Code connects through the relay over a secure channel.</desc>
  <defs>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="264" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">VS CODE TUNNELS</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="136" width="224" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="160" y="172" font-size="15" font-weight="600" fill="#F5F5F5">Your Machine</text>
    <text x="160" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">code tunnel</text>

    <rect x="368" y="136" width="224" height="88" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="172" font-size="15" font-weight="600" fill="#F5F5F5">VS Code Relay</text>
    <text x="480" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">secure rendezvous</text>

    <rect x="688" y="136" width="224" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="800" y="172" font-size="15" font-weight="600" fill="#F5F5F5">Remote Client</text>
    <text x="800" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">browser · VS Code</text>
  </g>

  <g fill="none" stroke="#38BDF8" stroke-width="1.2">
    <path d="M272,168 C304,168 332,168 364,168" marker-end="url(#arr-sky)"/>
    <path d="M688,192 C656,192 628,192 596,192" marker-end="url(#arr-sky)"/>
  </g>
  <text x="284" y="156" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">creates tunnel</text>
  <text x="608" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">connects via</text>
</svg>
