<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Evolution of AI coding tools, 2021 to 2026</title>
  <desc id="dg-desc">From Copilot and the original Codex API in 2021, through chat-based coding, multi-file editing and the agentic era, to mature agent ecosystems and standard AI pair programming in 2026.</desc>

  <rect x="8" y="8" width="944" height="384" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">AI CODING TOOLS · 2021–2026</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <line x1="64" y1="232" x2="896" y2="232" stroke="rgba(255,255,255,0.28)"/>

  <g text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <!-- 2021 (above) -->
    <circle cx="96" cy="232" r="4" fill="#9CA3AF"/>
    <text x="96" y="208" font-size="12" font-weight="600" fill="#F5F5F5">2021</text>
    <text x="96" y="164" font-size="11" fill="#9CA3AF">Copilot · Codex API</text>
    <text x="96" y="184" font-size="11" fill="#6B7280">tab-completion era</text>

    <!-- 2022 (below) -->
    <circle cx="256" cy="232" r="4" fill="#9CA3AF"/>
    <text x="256" y="264" font-size="12" font-weight="600" fill="#F5F5F5">2022</text>
    <text x="256" y="292" font-size="11" fill="#9CA3AF">ChatGPT for code</text>
    <text x="256" y="312" font-size="11" fill="#6B7280">prompt engineering</text>

    <!-- 2023 (above) -->
    <circle cx="416" cy="232" r="4" fill="#9CA3AF"/>
    <text x="416" y="208" font-size="12" font-weight="600" fill="#F5F5F5">2023</text>
    <text x="416" y="164" font-size="11" fill="#9CA3AF">GPT-4 · Claude 2 100K</text>
    <text x="416" y="184" font-size="11" fill="#6B7280">multi-file editing</text>

    <!-- 2024 (below) -->
    <circle cx="576" cy="232" r="4" fill="#9CA3AF"/>
    <text x="576" y="264" font-size="12" font-weight="600" fill="#F5F5F5">2024</text>
    <text x="576" y="292" font-size="11" fill="#9CA3AF">Claude Code · Cursor</text>
    <text x="576" y="312" font-size="11" fill="#6B7280">agentic era begins</text>

    <!-- 2025 (above) -->
    <circle cx="736" cy="232" r="4" fill="#9CA3AF"/>
    <text x="736" y="208" font-size="12" font-weight="600" fill="#F5F5F5">2025</text>
    <text x="736" y="164" font-size="11" fill="#9CA3AF">Codex CLI open-sourced</text>
    <text x="736" y="184" font-size="11" fill="#6B7280">MCP adopted widely</text>

    <!-- 2026 (below, focal) -->
    <circle cx="880" cy="232" r="5" fill="#F59E0B"/>
    <text x="872" y="264" font-size="12" font-weight="600" fill="#F59E0B">2026</text>
    <text x="848" y="292" font-size="11" fill="#F59E0B">Fable 5 · Opus 4.8</text>
    <text x="848" y="312" font-size="11" fill="#9CA3AF">AI pairing standard</text>
  </g>
</svg>
