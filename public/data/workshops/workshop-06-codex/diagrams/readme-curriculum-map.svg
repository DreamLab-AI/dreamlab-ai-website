<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Workshop learning path</title>
  <desc id="dg-desc">Nine modules in sequence: introduction, the AI coding ecosystem, getting started, mastering AI agents, practical applications, the broader landscape, challenges, best practices and conclusion.</desc>

  <defs>
