<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Structure of the day</title>
  <desc id="dg-desc">The morning covers single agents — tool use with MCP, memory and configuration, agent patterns — leading into the afternoon on orchestration: subagent delegation, workflow design, and safety and cost control.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="264" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">STRUCTURE OF THE DAY</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- morning -->
  <g text-anchor="middle">
    <rect x="112" y="112" width="288" height="136" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="256" y="148" font-size="15" font-weight="600" fill="#F5F5F5">Morning · Single Agents</text>
    <text x="256" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">tool use &amp; MCP</text>
    <text x="256" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">memory &amp; config</text>
    <text x="256" y="224" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">agent patterns</text>
  </g>

  <path d="M400,180 L556,180" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- afternoon (focal) -->
  <g text-anchor="middle">
    <rect x="560" y="112" width="288" height="136" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="704" y="148" font-size="15" font-weight="600" fill="#F5F5F5">Afternoon · Orchestration</text>
    <text x="704" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">subagent delegation</text>
    <text x="704" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">workflow design</text>
    <text x="704" y="224" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">safety &amp; cost control</text>
  </g>
</svg>
