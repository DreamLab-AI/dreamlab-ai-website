<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Agent architecture</title>
  <desc id="dg-desc">Project config and memory feed the LLM core, which reasons and executes through an MCP tool router connected to web search, code execution, external APIs, the file system and git.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="432" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">AGENT ARCHITECTURE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- top row -->
  <g text-anchor="middle">
    <rect x="48" y="104" width="224" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="160" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Project Config</text>
    <text x="160" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">CLAUDE.md</text>

    <rect x="368" y="104" width="224" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="140" font-size="15" font-weight="600" fill="#F5F5F5">LLM Core</text>
    <text x="480" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">reasoning · execution</text>

    <rect x="688" y="104" width="224" height="80" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="800" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Memory</text>
    <text x="800" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">short-term · long-term</text>
  </g>

  <!-- router -->
  <g text-anchor="middle">
    <rect x="368" y="232" width="224" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="260" font-size="14" font-weight="600" fill="#F5F5F5">MCP Tool Router</text>
    <text x="480" y="280" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">one protocol, many tools</text>
  </g>

  <!-- tools -->
  <g text-anchor="middle">
    <rect x="240" y="344" width="480" height="72" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="480" y="376" font-size="14" font-weight="600" fill="#F5F5F5">Tools</text>
    <text x="480" y="398" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">web search · code exec · APIs · files · git</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M272,144 L364,144" marker-end="url(#arr)"/>
    <path d="M688,144 L596,144" marker-end="url(#arr)"/>
    <path d="M480,184 L480,228" marker-end="url(#arr)"/>
  </g>
  <g fill="none" stroke="#38BDF8" stroke-width="1.2">
    <path d="M480,296 L480,340" marker-end="url(#arr-sky)"/>
  </g>
  <text x="496" y="324" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#38BDF8">MCP</text>
</svg>
