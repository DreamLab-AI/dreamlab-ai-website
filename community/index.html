<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community Forums</title>
    <meta name="description" content="Community Forums — a private space for our community" />
    <meta name="theme-color" content="#111827" />

    <!-- GitHub Pages SPA deep-link restore: picks up redirect from root 404.html -->
    <script>
        (function(){
            var q = new URLSearchParams(window.location.search);
            var redirect = q.get('__p');
            if (redirect) {
                q.delete('__p');
                var qs = q.toString();
                var base = '/community';
                var full = base + redirect + (qs ? '?' + qs : '') + window.location.hash;
                history.replaceState(null, '', full);
            }
        })();
    </script>

    <!-- Favicon + PWA marks.
         Single source of truth: assets/icons/icon.svg (rasters generated by
         scripts/gen-pwa-icons.sh). The tab favicon, the iOS home-screen icon,
         and the manifest icons are now THE SAME MARK, which is the point —
         the previous build used an inline amber-diamond data-URI for the tab
         but pointed the manifest at the retro BBS client's black terminal
         icon, so the installed app was unidentifiable on a home screen. -->
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Tailwind utilities (tree-shaken at build time by Tailwind CLI v3.4.17,
         driven by Trunk pre_build hook in Trunk.toml). Replaces the legacy
         cdn.tailwindcss.com Play CDN — Chrome flags that as dev-only and it
         shipped ~3MB of unused CSS to every visitor. The pre_build hook scans
         src/**/*.rs (Leptos view! macros) plus index.html and emits a
         minified tailwind.dist.css. Config: tailwind.config.js. -->
    <link rel="stylesheet" href="/community/tailwind.dist-2a255783c0656ff4.css" integrity="sha384-z9dGJyouR+1ButvM1FvAZTbnMOayfKfKe+GdMmAn1K+OUgXYY/wdb8p0GH3mtKNT"/>

    <!-- Shared design tokens (same source as React marketing site) -->
    <link rel="stylesheet" href="/community/design-tokens-87aa802dc4ac0d31.css" integrity="sha384-LzBEMGY70JF2PjhwLnqgpXmgsHQ2QB7IKQLIWQtXWnstU5ZglNWgBuR/dhmdWBkI"/>
    <!-- Forum-specific styles (imports design-tokens.css for @import fallback) -->
    <link rel="stylesheet" href="/community/style-aa9618cb8c324600.css" integrity="sha384-q6BljvPh9vFzE+eMt8exI7sWVvxDsNA41GPYIE5Bs25oU7yAP7L+0BozKRTBvxA1"/>

    <!-- Runtime config placeholder — DO NOT commit real endpoints, admin keys,
         or branding here.
         The deploy pipeline REPLACES this entire <script> block with the
         operator's real `window.__ENV__` (relay/auth/pod/search endpoints,
         zones, branding, build metadata). It is intentionally empty in the kit
         so an un-injected build (local Trunk, or CI without the deploy step)
         falls back to the client's own safe defaults — the production relay,
         a brand-neutral forum name, the legacy zone list, and "dev"/"local"
         build strings — rather than shipping any operator- or dev-specific
         endpoints that are unreachable off the dev box. -->
    <script>
    window.__ENV__ = window.__ENV__ || {};
    </script>

    <!-- Trunk WASM bundle injection (workspace: specify package + binary).
         data-wasm-opt="0" disables Trunk's bundled wasm-opt 122 which rejects
         Rust 1.90's bulk-memory ops. We run a manually-installed binaryen 119
         in a post_build Trunk hook instead — see Trunk.toml. -->
    
<script type="module">
import init, * as bindings from '/community/nostr-bbs-forum-client-12dab9f5898eea0e.js';
const wasm = await init({ module_or_path: '/community/nostr-bbs-forum-client-12dab9f5898eea0e_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

    <!-- Service worker copied to dist/community/sw.js so main.rs's
         navigator.serviceWorker.register('./sw.js') resolves at runtime.
         Trunk's correct asset-copy directive is rel="copy-file"; the [[copy]]
         table in Trunk.toml is silently ignored. -->
    

    <!-- PWA manifest: installs the MAIN forum interface as the home-screen app
         (scope /community/, one-shot boot via ?pwa=1). Copied verbatim so the
         relative href resolves at the served base; the deploy re-brands
         name/short_name. The retro BBS keeps its own nested-scope manifest at
         /community/bbs/ for those who prefer that interface. -->
    
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- The forum's own icon set. Previously the manifest borrowed
         /community/bbs/icons/* — the RETRO BBS client's icons — which made the
         installed forum PWA look identical to the BBS PWA (and broke outright
         if the operator deployed the forum without the bbs sub-app). These are
         relative to the manifest's scope so they resolve wherever the kit is
         served from. -->
    

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Community" />
    <!-- iOS ignores the manifest's icons entirely and ignores SVG touch icons;
         without this link it screenshots the page for the home-screen tile. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Dark chrome behind the notch, matching theme_color and the app's own
         dark-first surface (rather than iOS's default opaque white bar). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<body>
    <!-- Loading screen — replaced by Leptos mount_to_body() -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-ring"></div>
        <h1 class="loading-logo gradient-text">nostr-bbs</h1>
        <p class="loading-status">Initializing&hellip;</p>

    <noscript>This application requires JavaScript and WebAssembly.</noscript>
</body>
