# One-shot, operator-triggered export of the legacy Supabase form tables
# (email_subscribers, contact_submissions) retired in Aug 2026 (c288f72).
# The dump is encrypted on the runner to an ephemeral operator-held RSA key
# before upload, so no PII or credentials ever appear in public logs or
# artifacts. Delete this workflow after the export is retrieved.
name: Supabase archive dump (one-shot)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and encrypt legacy tables
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cat > pub.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAx5GiSQA+5+t3+YLTPAFO
          XnhFkRqSil/FDp0UjP1YBoov3IuxvapYgaMTfYLdTl5DOvntuKSV9X6cs4QtPzpZ
          aDn8Q3Xy13GAuCuUt6muDrDgUduCssWyViZ7xMNbaAO+Dj3HGBdl+CIKX1fvilgV
          XzVaPbWrDuIgNFoAu5oa4NPT6/VD/m/Giq/C9HcwF+P5FKbSGgGN/NhcpKa25m/k
          rNFfkLuFZwOrfSb0rJVG6f1BkTInR4PzwiXFh85GrbYrpUdoZ9QHamvggsgXY3fm
          tbxx9y3RW9botREtm9cJdo+WYU9xJVCmHUgYDYMWXprlOUdW7vy1XCXd+18IFt45
          TOT+OuZOf0X/DkXTPd1w6zrTfths82UBF2YoozE9Q04sn1mi4YC8acDXIComMEm4
          nuR0uMaufGlAM9oF59xuFHO4W7a2p4Ypj0Dq4538MdvZ8e5ItfUc4V2IgmaQy29A
          kOFkEDQbPpNOeUISoteuvfllU2LMPJ63PinsgLspMDt5AgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          for t in email_subscribers contact_submissions; do
            code=$(curl -s -o "$t.json" -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/$t?select=*&limit=10000" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
            echo "$t -> HTTP $code, $(wc -c < "$t.json") bytes"
          done
          tar czf dump.tgz email_subscribers.json contact_submissions.json
          openssl rand -out aes.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -pass file:aes.bin -in dump.tgz -out dump.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in aes.bin -out aes.enc
          rm -f dump.tgz aes.bin email_subscribers.json contact_submissions.json
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-archive-encrypted
          path: |
            dump.enc
            aes.enc
          retention-days: 1
