name: Set CF Worker secrets (v2 workers)

# One-shot workflow: writes operator-provided secrets to the LIVE v2 Workers via
# the CF Workers Secrets API (worker names = `name` in forum-config/deploy/*.wrangler.toml;
# scripts/check-config-mirrors.mjs fails CI if a target here is not one of them).
#
# dreamlab-auth-api-v2:
#   ADMIN_PUBKEYS          — must equal forum-config/dreamlab.toml [admin].static_pubkeys
#                            (checked before the write: a stale GH secret would
#                            otherwise reinstate the retired v1 admin key)
#   PRF_SERVER_SECRET      — set ONLY when the worker has none. It salts every
#                            passkey's PRF derivation, so overwriting it breaks every
#                            existing v2 login; the GH secret may still hold the v1 value.
#   NATIVE_POD_URL, NATIVE_POD_ADMIN_KEY — optional on v2 (native pod tier unused);
#                            skipped when the GH secret is empty.
# dreamlab-nostr-relay-v2, dreamlab-auth-api-v2:
#   TYPESAFE_API_KEY       — System One consumers (relay JEV_TRIAGE, auth JEV_RATIONALE_CHECK).
#
# Not here, by design:
#   - VAPID_PRIVATE_KEY: Web Push is off on the v2 relay (PUSH_ENABLED = "false") and
#     its wrangler.toml carries no VAPID_PUBLIC_KEY to pair with. When push is turned
#     on, the operator sets it with the relay's manual deploy (RUNBOOK §9):
#     `wrangler secret put VAPID_PRIVATE_KEY --name dreamlab-nostr-relay-v2`.
#   - dreamlab-search-api-v2: not provisioned (no worker, bucket or KV namespace).
#
# Secret values are read from the environment, never argv. Trigger manually after
# setting the matching GH repo secrets. Safe to re-run — PUT is idempotent.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTH_WORKER: dreamlab-auth-api-v2

jobs:
  set-secrets:
    name: Push secrets to dreamlab-auth-api-v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the authored admin set)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set NATIVE_POD_URL / NATIVE_POD_ADMIN_KEY on auth worker (optional)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NATIVE_POD_URL: ${{ secrets.NATIVE_POD_URL }}
          NATIVE_POD_ADMIN_KEY: ${{ secrets.NATIVE_POD_ADMIN_KEY }}
        run: |
          set -euo pipefail
          for name in NATIVE_POD_URL NATIVE_POD_ADMIN_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::GH secret $name is empty; skipped (the native pod tier is optional on v2)."
              continue
            fi
            # jq reads the value from the environment (env[$n]), so it never enters argv.
            jq -n --arg n "$name" '{name: $n, text: env[$n], type: "secret_text"}' |
              curl -sS -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${AUTH_WORKER}/secrets" \
                -H "Authorization: Bearer ${CF_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @- \
              | jq -e '.success'
          done

      - name: Set PRF_SERVER_SECRET on auth worker (only if absent)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.PRF_SERVER_SECRET }}
        run: |
          set -euo pipefail
          # Cloudflare never returns a secret's value, only its name. An existing
          # value is always kept: rotating it breaks every passkey registered on v2.
          NAMES=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${AUTH_WORKER}/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -er '.result[].name')
          if printf '%s\n' "${NAMES}" | grep -qx PRF_SERVER_SECRET; then
            echo "::notice::PRF_SERVER_SECRET already set on ${AUTH_WORKER}; existing value kept (rotation would break existing passkeys)."
            exit 0
          fi
          if [ -z "${SECRET_VALUE:-}" ]; then
            echo "::error::PRF_SERVER_SECRET is set neither as a GH secret nor on ${AUTH_WORKER} — generate one (openssl rand -hex 32) and set it first." >&2
            exit 1
          fi
          jq -n '{name: "PRF_SERVER_SECRET", text: env.SECRET_VALUE, type: "secret_text"}' |
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${AUTH_WORKER}/secrets" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @- \
            | jq -e '.success'

      - name: Set ADMIN_PUBKEYS on auth worker (must match dreamlab.toml)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.ADMIN_PUBKEYS }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE:-}" ]; then
            echo "::error::GH secret ADMIN_PUBKEYS is empty — set it first." >&2
            exit 1
          fi
          # Refuse a value that is not exactly the authored admin set: the GH secret
          # predates the v2 cutover and may still name the retired v1 admin key.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseToml } from "./scripts/lib/toml-lite.mjs";
            const norm = (a) => a.map((k) => k.trim().toLowerCase()).filter(Boolean).sort().join(",");
            const want = norm(parseToml(readFileSync("forum-config/dreamlab.toml", "utf8")).admin?.static_pubkeys ?? []);
            const got = norm(process.env.SECRET_VALUE.split(","));
            if (!want) { console.error("::error::dreamlab.toml [admin].static_pubkeys is empty"); process.exit(1); }
            if (got !== want) {
              console.error("::error::GH secret ADMIN_PUBKEYS does not match forum-config/dreamlab.toml [admin].static_pubkeys (" + want + "). Update the GH secret; nothing was written.");
              process.exit(1);
            }
          '
          jq -n '{name: "ADMIN_PUBKEYS", text: env.SECRET_VALUE, type: "secret_text"}' |
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${AUTH_WORKER}/secrets" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @- \
            | jq -e '.success'

      - name: Confirm
        run: echo "✓ NATIVE_POD_* (set or skipped), PRF_SERVER_SECRET (set or kept), ADMIN_PUBKEYS on ${AUTH_WORKER}"

  set-system-one-secrets:
    # Cloudflare answers 409 when two secret writes hit one Worker at once, and the
    # auth job writes to the auth worker. Run after it, whatever its outcome (the
    # auth job's own failure must not block this one).
    needs: [set-secrets]
    if: ${{ always() }}
    name: Provision System One consumers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [dreamlab-nostr-relay-v2, dreamlab-auth-api-v2]
    steps:
      - name: Set Typesafe credential (moderation and rationale check)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.TYPESAFE_API_KEY }}
          WORKER_NAME: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE:-}" ]; then
            echo "::error::GH secret TYPESAFE_API_KEY is empty; provision it before enabling the public System One consumers." >&2
            exit 1
          fi
          # Read the value from the environment, not argv or diagnostic output.
          # Retry a concurrent-edit 409 (another deploy or secret write in flight).
          for attempt in 1 2 3 4 5; do
            code=$(jq -n '{name: "TYPESAFE_API_KEY", text: env.SECRET_VALUE, type: "secret_text"}' |
              curl --silent --show-error -o /tmp/cf.json -w '%{http_code}' \
                -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/secrets" \
                -H "Authorization: Bearer ${CF_TOKEN}" \
                -H 'Content-Type: application/json' --data-binary @-)
            if [ "$code" = 200 ] && jq -e '.success == true' /tmp/cf.json > /dev/null; then exit 0; fi
            if [ "$code" != 409 ]; then echo "::error::Cloudflare returned HTTP $code" >&2; exit 1; fi
            echo "409 concurrent edit on ${WORKER_NAME}; retry ${attempt}/5" >&2
            sleep $((attempt * 5))
          done
          echo "::error::still 409 after 5 attempts" >&2; exit 1
