name: Set CF Worker secrets (native pod mesh)

# One-shot workflow: writes the operator-provided secrets to the
# dreamlab-auth-api Cloudflare Worker via the CF Workers Secrets API:
#   NATIVE_POD_URL, NATIVE_POD_ADMIN_KEY  — native pod mesh PSK (Gap 3)
#   PRF_SERVER_SECRET                     — keys passkey PRF salt derivation
#   ADMIN_PUBKEYS                         — comma-sep 64-hex x-only admin pubkeys
# All four are validated by the workers-deploy.yml pre-deploy gate; the
# pipeline never generates them. Trigger manually after setting the matching
# GH repo secrets. Safe to re-run — PUT is idempotent.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secrets:
    name: Push secrets to dreamlab-auth-api
    runs-on: ubuntu-latest
    steps:
      - name: Set NATIVE_POD_URL on auth worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.NATIVE_POD_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::GH secret NATIVE_POD_URL is empty — set it first." >&2
            exit 1
          fi
          # Build the JSON body with jq so a value containing a quote or backslash
          # is escaped correctly instead of corrupting the stored secret.
          BODY=$(jq -n --arg name "NATIVE_POD_URL" --arg text "${SECRET_VALUE}" \
            '{name: $name, text: $text, type: "secret_text"}')
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/dreamlab-auth-api/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${BODY}" \
            | jq -e '.success'

      - name: Set NATIVE_POD_ADMIN_KEY on auth worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.NATIVE_POD_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::GH secret NATIVE_POD_ADMIN_KEY is empty — set it first." >&2
            exit 1
          fi
          BODY=$(jq -n --arg name "NATIVE_POD_ADMIN_KEY" --arg text "${SECRET_VALUE}" \
            '{name: $name, text: $text, type: "secret_text"}')
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/dreamlab-auth-api/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${BODY}" \
            | jq -e '.success'

      - name: Set PRF_SERVER_SECRET on auth worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.PRF_SERVER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::GH secret PRF_SERVER_SECRET is empty — set it first." >&2
            exit 1
          fi
          BODY=$(jq -n --arg name "PRF_SERVER_SECRET" --arg text "${SECRET_VALUE}" \
            '{name: $name, text: $text, type: "secret_text"}')
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/dreamlab-auth-api/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${BODY}" \
            | jq -e '.success'

      - name: Set ADMIN_PUBKEYS on auth worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.ADMIN_PUBKEYS }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::GH secret ADMIN_PUBKEYS is empty — set it first." >&2
            exit 1
          fi
          BODY=$(jq -n --arg name "ADMIN_PUBKEYS" --arg text "${SECRET_VALUE}" \
            '{name: $name, text: $text, type: "secret_text"}')
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/dreamlab-auth-api/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${BODY}" \
            | jq -e '.success'

      - name: Confirm
        run: echo "✓ NATIVE_POD_URL, NATIVE_POD_ADMIN_KEY, PRF_SERVER_SECRET, ADMIN_PUBKEYS set on dreamlab-auth-api"

  set-push-secret:
    name: Push VAPID private key to dreamlab-nostr-relay
    runs-on: ubuntu-latest
    steps:
      - name: Set VAPID_PRIVATE_KEY on relay worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::GH secret VAPID_PRIVATE_KEY is empty — mint a pair with the kit's vapid_keygen example and set it first." >&2
            exit 1
          fi
          # Web Push (kit ADR-2023): the relay signs every push with this key.
          # Must match VAPID_PUBLIC_KEY in forum-config/deploy/relay-worker.wrangler.toml;
          # the relay refuses to enable push if the pair is inconsistent.
          BODY=$(jq -n --arg name "VAPID_PRIVATE_KEY" --arg text "${SECRET_VALUE}" \
            '{name: $name, text: $text, type: "secret_text"}')
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/dreamlab-nostr-relay/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${BODY}" \
            | jq -e '.success'

  set-system-one-secrets:
    name: Provision public System One consumers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [dreamlab-search-api, dreamlab-nostr-relay]
    steps:
      - name: Set Typesafe credential (public search and moderation only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.TYPESAFE_API_KEY }}
          WORKER_NAME: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE:-}" ]; then
            echo "::error::GH secret TYPESAFE_API_KEY is empty; provision it before enabling the public System One consumers." >&2
            exit 1
          fi
          # Read the value from the environment, not argv or diagnostic output.
          jq -n '{name: "TYPESAFE_API_KEY", text: env.SECRET_VALUE, type: "secret_text"}' |
            curl --fail --silent --show-error \
              -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/secrets" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H 'Content-Type: application/json' --data-binary @- |
            jq -e '.success == true' > /dev/null
