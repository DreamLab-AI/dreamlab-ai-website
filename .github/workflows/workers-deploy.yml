name: Deploy Cloudflare Workers

# Deploys the CI-managed v2 Rust Workers from the nostr-bbs kit (nostr-rust-forum):
# dreamlab-auth-api-v2, dreamlab-pod-api-v2, dreamlab-link-preview-v2. Source is
# cloned at build time; DreamLab-specific wrangler.toml configs from
# forum-config/deploy/ override the kit defaults (the deployed name is the toml's
# `name`, so matrix.worker_name must equal it; check-config-mirrors.mjs enforces it).
#
# NOT deployed here, by design:
#   - relay-worker (dreamlab-nostr-relay-v2): operator-deployed by hand from the
#     container with a scoped token (relay-worker.wrangler.toml header, RUNBOOK §9).
#   - search-worker (dreamlab-search-api-v2): not provisioned on v2 (no worker, no
#     dreamlab-vectors-v2 bucket, no SEARCH_CONFIG namespace); its manifest fails
#     the deploy_config validator until the operator provisions it.

on:
  # push trigger removed for the v2 switch (golive RUNBOOK §17): workers are deployed by hand only.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  RUST_TOOLCHAIN: '1.90.0'
  WRANGLER_VERSION: '3.114.17'
  CF_SUBDOMAIN: 'solitary-paper-764d'
  KIT_REPO: 'https://github.com/DreamLab-AI/nostr-rust-forum.git'
  # The kit commit the workers and clients build from. Do NOT float on `main`: a
  # breaking upstream push would silently ship untested worker code. It must be
  # identical in deploy.yml, workers-deploy.yml and rust-ci.yml and equal
  # CANONICAL_KIT_SHA in the compatibility record (scripts/lib/pin-parity.mjs).
  # forum-config/Cargo.lock holds no git rev: the library crates come from crates.io.
  # Cutover provenance (crate versions, release notes, registry checksums) lives
  # in docs/architecture/kit-compatibility-record.md, which pin-parity verifies
  # against this exact SHA. Never restate the kit version or release notes here;
  # the prose rots on every repin (beta.9 / rc11 / beta.14 all went stale).
  KIT_REF: '084b077f36a095e783c98519c2b3277e665ff9f0'

jobs:
  gate:
    name: Pre-deploy Gate
    if: github.repository == 'DreamLab-AI/dreamlab-ai-website'
    uses: ./.github/workflows/test-and-lint.yml
    permissions:
      contents: read

  deploy-rust:
    name: Deploy Rust Workers
    needs: [gate]
    if: |
      github.repository == 'DreamLab-AI/dreamlab-ai-website'
      && needs.gate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - kit_crate: nostr-bbs-auth-worker
            config: auth-worker
            worker_name: dreamlab-auth-api-v2
          - kit_crate: nostr-bbs-pod-worker
            config: pod-worker
            worker_name: dreamlab-pod-api-v2
          - kit_crate: nostr-bbs-preview-worker
            config: preview-worker
            worker_name: dreamlab-link-preview-v2

    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clone kit (nostr-rust-forum) at pinned SHA
        run: |
          git clone --filter=blob:none --no-checkout ${{ env.KIT_REPO }} kit
          git -C kit checkout --detach ${{ env.KIT_REF }}

      - name: Override wrangler.toml with DreamLab config
        env:
          CONFIG: ${{ matrix.config }}
          KIT_CRATE: ${{ matrix.kit_crate }}
          WORKER_NAME: ${{ matrix.worker_name }}
        run: |
          set -euo pipefail
          cp "forum-config/deploy/${CONFIG}.wrangler.toml" "kit/crates/${KIT_CRATE}/wrangler.toml"
          # Every binding id must be real: no REPLACE_WITH_* or <...> placeholder
          # (the v2 manifests carry resolved ids; nothing is provisioned here).
          if grep -nE '(REPLACE_WITH_|"<[^"]*>")' "kit/crates/${KIT_CRATE}/wrangler.toml"; then
            echo "::error::${CONFIG}.wrangler.toml still carries a placeholder binding id; refusing to deploy." >&2
            exit 1
          fi
          # The matrix label must name the worker wrangler will actually deploy.
          deployed=$(grep -m1 -oP '^name\s*=\s*"\K[^"]+' "kit/crates/${KIT_CRATE}/wrangler.toml")
          if [ "$deployed" != "$WORKER_NAME" ]; then
            echo "::error::matrix worker_name ${WORKER_NAME} != wrangler name ${deployed}" >&2
            exit 1
          fi

      - name: Setup Rust toolchain ${{ env.RUST_TOOLCHAIN }}
        # Pinned to the commit the `1.90.0` branch resolves to (that branch's
        # action.yml hardcodes toolchain 1.90.0). Full SHA, not a mutable tag,
        # because this job carries CLOUDFLARE_API_TOKEN. Re-pin when bumping Rust.
        uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2 # 1.90.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            kit/target
          key: rust-deploy-${{ env.RUST_TOOLCHAIN }}-${{ matrix.kit_crate }}-${{ hashFiles('kit/Cargo.lock') }}
          restore-keys: |
            rust-deploy-${{ env.RUST_TOOLCHAIN }}-${{ matrix.kit_crate }}-
            rust-deploy-${{ env.RUST_TOOLCHAIN }}-

      - name: Install worker-build
        env:
          # worker-build 0.8.5 (2026-06-12) emits Cloudflare's panic/abort-recovery
          # codegen, passing `--force-enable-abort-handler` to wasm-bindgen. Even on
          # wasm-bindgen 0.2.125 (which accepts the flag) the codegen then fails with
          # `error: failed to generate catch wrappers` — these worker crates aren't
          # built for the abort-handler's exception-handling requirements. 0.8.4 is
          # the last release that does NOT emit the abort handler and is what the last
          # green deploy used. Abort-recovery is a non-blocking follow-up (needs the
          # worker crates configured for catch wrappers, tracked separately).
          # Version-aware reinstall handles a cached 0.8.5 from a prior failed run.
          WORKER_BUILD_VERSION: '0.8.4'
        run: |
          if ! worker-build --version 2>/dev/null | grep -q "$WORKER_BUILD_VERSION"; then
            cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked --force
          fi
          worker-build --version

      # Pre-seed worker-build's wasm-bindgen cache. worker-build downloads the
      # wasm-bindgen CLI matching the kit lockfile from GitHub releases with a
      # plain unauthenticated fetch and NO retry; Actions runners get throttled
      # on that path intermittently (two identical 'Failed to fetch URL'
      # failures on cold-cache jobs, 2026-08-13, while warm-cache siblings
      # passed). Seed the exact cache layout worker-build expects
      # (~/.cache/worker-build/wasm-bindgen-<target>-<ver>/, tarball flattened)
      # with a retrying curl so the in-build download never runs.
      - name: Pre-seed wasm-bindgen for worker-build
        run: |
          set -euo pipefail
          WB_VER=$(grep -A1 '^name = "wasm-bindgen"$' kit/Cargo.lock | grep -oP 'version = "\K[^"]+')
          if [ -z "$WB_VER" ]; then echo "::error::wasm-bindgen version not found in kit/Cargo.lock" >&2; exit 1; fi
          DEST="$HOME/.cache/worker-build/wasm-bindgen-x86_64-unknown-linux-musl-${WB_VER}"
          if [ -x "$DEST/wasm-bindgen" ]; then echo "cache warm: $DEST"; exit 0; fi
          mkdir -p "$DEST"
          URL="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WB_VER}/wasm-bindgen-${WB_VER}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 "$URL" | tar xz --strip-components=1 -C "$DEST"
          test -x "$DEST/wasm-bindgen" && "$DEST/wasm-bindgen" --version

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install wrangler ${{ env.WRANGLER_VERSION }}
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}

      # Fail fast (deploy time, not request time) when an operator-provided
      # server secret is missing on the auth-worker. The kit auth-worker derives
      # the WebAuthn PRF salt from PRF_SERVER_SECRET; absent, register/login 500
      # on the first request. R-09: surface this as a deploy blocker instead.
      # Secrets are operator data — this only checks presence, never sets values.
      - name: Validate public System One credential
        if: matrix.config == 'auth-worker'
        working-directory: kit/crates/${{ matrix.kit_crate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler secret list > /tmp/system-one-secret-names.json
          if ! jq -e 'any(.[]; .name == "TYPESAFE_API_KEY")' /tmp/system-one-secret-names.json > /dev/null; then
            echo "::error::TYPESAFE_API_KEY Worker secret missing. Run set-worker-secrets.yml before deploying the enabled System One consumers." >&2
            exit 1
          fi

      - name: Validate required auth-worker secrets are set
        if: matrix.config == 'auth-worker'
        working-directory: kit/crates/${{ matrix.kit_crate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # `wrangler secret list` returns [{ "name": "...", "type": "secret_text" }, ...]
          SET_SECRETS=$(wrangler secret list 2>/dev/null | jq -r '.[].name' || true)
          MISSING=()
          # NATIVE_POD_ADMIN_KEY + NATIVE_POD_URL: PSK and base URL for the
          # native pod tier (Gap 3). The auth-worker's /api/native-pod/provision
          # sends X-Pod-Admin-Key to NATIVE_POD_URL; absent either, it 503s
          # "native pod not configured" — graceful, not a crash. These are
          # OPTIONAL: the native tier is only provisioned when the agentbox
          # solid-pod-rs server + CF Tunnel are running. Warn but don't block.
          OPTIONAL=(NATIVE_POD_ADMIN_KEY NATIVE_POD_URL)
          for required in PRF_SERVER_SECRET ADMIN_PUBKEYS; do
            if ! grep -qxF "$required" <<<"$SET_SECRETS"; then
              MISSING+=("$required")
            fi
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::auth-worker is missing required secret(s): ${MISSING[*]}." \
                 "Set them with 'wrangler secret put <NAME> --name dreamlab-auth-api-v2'" \
                 "(or run set-worker-secrets.yml) before deploying. These are" \
                 "operator-provided values — the pipeline never generates them." >&2
            exit 1
          fi
          for opt in "${OPTIONAL[@]}"; do
            if ! grep -qxF "$opt" <<<"$SET_SECRETS"; then
              echo "::warning::auth-worker is missing optional secret $opt." \
                   "Native pod provisioning will 503 until set."
            fi
          done
          echo "[secrets] required secrets present: PRF_SERVER_SECRET, ADMIN_PUBKEYS"

      - name: Wrangler deploy ${{ matrix.kit_crate }}
        working-directory: kit/crates/${{ matrix.kit_crate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

  health-check:
    name: Health Checks
    if: github.repository == 'DreamLab-AI/dreamlab-ai-website'
    needs: [deploy-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Wait for propagation
        run: sleep 10

      - name: Check all workers
        run: |
          set -euo pipefail
          PASS=0
          FAIL=0
          FAILED_WORKERS=()
          # Only the workers this workflow deploys; the manually deployed relay is
          # checked by its own runbook.
          for worker in dreamlab-auth-api-v2 dreamlab-pod-api-v2 dreamlab-link-preview-v2 ; do
            URL="https://${worker}.${{ env.CF_SUBDOMAIN }}.workers.dev/health"
            # Retry: a worker's Durable Object is cold right after a deploy and the
            # first request can take longer than one probe allows; a 000 here was
            # a connection that never completed, not an unhealthy answer.
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 3 --retry-all-errors --retry-delay 5 "$URL" || echo "000")
            echo "${worker}: HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "  PASS"
              PASS=$((PASS + 1))
            else
              echo "::error::${worker} health check FAILED (HTTP ${STATUS}); only HTTP 200 is accepted as healthy"
              FAIL=$((FAIL + 1))
              FAILED_WORKERS+=("${worker}(HTTP ${STATUS})")
            fi
          done
          echo ""
          echo "Results: ${PASS} passed, ${FAIL} failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::Health check failed for: ${FAILED_WORKERS[*]}"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Cloudflare Workers Deployment

          | Worker | Kit Crate | URL |
          |--------|-----------|-----|
          | dreamlab-auth-api-v2 | nostr-bbs-auth-worker | \`dreamlab-auth-api-v2.${{ env.CF_SUBDOMAIN }}.workers.dev\` |
          | dreamlab-pod-api-v2 | nostr-bbs-pod-worker | \`dreamlab-pod-api-v2.${{ env.CF_SUBDOMAIN }}.workers.dev\` |
          | dreamlab-link-preview-v2 | nostr-bbs-preview-worker | \`dreamlab-link-preview-v2.${{ env.CF_SUBDOMAIN }}.workers.dev\` |

          Not deployed by this workflow: \`dreamlab-nostr-relay-v2\` (manual, RUNBOOK §9), \`dreamlab-search-api-v2\` (not provisioned).

          - **Kit**: \`nostr-rust-forum@${{ env.KIT_REF }}\`
          - **Wrangler**: \`${{ env.WRANGLER_VERSION }}\`
          - **Rust**: \`${{ env.RUST_TOOLCHAIN }}\`
          EOF
