# v2 pod worker. Secret: MASTER_SECRET (new random). New bucket dreamlab-pods-v2; the OLD dreamlab-pod-api + dreamlab-pods stay up
# (8 verbatim zone2 posts link the old host; 19 old objects are also copied bucket-to-bucket to the identical key, RUNBOOK §12).
name = "dreamlab-pod-api-v2"
main = "build/worker/shim.mjs"
compatibility_date = "2025-09-01"

[build]
command = "worker-build --release"

[[r2_buckets]]
binding = "PODS"
bucket_name = "dreamlab-pods-v2"

[[kv_namespaces]]
binding = "ADMIN_KV_RO"
id = "36c5f8d2157b4b3e8ef53c47c7fb68f1"

[[kv_namespaces]]
binding = "POD_META"
id = "d4c2d7bc103e4ce697340fa6962d2728"

[[d1_databases]]
binding = "REPLAY_DB"
database_name = "dreamlab-auth-v2"
database_id = "a53a49db-beec-4ee5-b09b-a2573923d21f"

[[d1_databases]]
binding = "RELAY_DB"
database_name = "dreamlab-relay-v2"
database_id = "eb33cf2f-44db-433c-9771-6db850d8b64c"

[vars]
EXPECTED_ORIGIN = "https://dreamlab-ai.com"
POD_BASE_URL = "https://dreamlab-pod-api-v2.solitary-paper-764d.workers.dev"
# Zone-restricted media (media/zones/<zone>/): CORS allow-list for restricted reads, zone map, admin list, device-key switch.
ALLOWED_ORIGINS = "https://dreamlab-ai.com,https://thedreamlab.uk"
ZONE_CONFIG = '[{"id":"zone1","slug":"welcome","display_name":"Welcome","required_cohorts":[],"write_cohorts":["members","agent","minimoonoir","family","dreamlab"],"banner_image_url":"/images/heroes/lake-district-dawn.webp","visibility":"public","encrypted":false,"accent_hex":"#22c55e"},{"id":"zone2","slug":"minimoonoir","display_name":"Minimoonoir","required_cohorts":["zone2","minimoonoir"],"banner_image_url":"/images/heroes/minimoonoir-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#3b82f6","section_order":["zone2-rants"],"history_from_epoch":5},{"id":"zone3","kanban":true,"slug":"family","display_name":"Family","required_cohorts":["zone3","family"],"banner_image_url":"/images/heroes/family-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#f59e0b"},{"id":"zone4","kanban":true,"slug":"dreamlab","display_name":"DreamLab","required_cohorts":["zone4","dreamlab"],"banner_image_url":"/images/heroes/business-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#a855f7","agent_keys":true},{"id":"chat-with-agents","slug":"chat-with-agents","display_name":"Chat with agents","required_cohorts":["chat-with-agents"],"banner_image_url":"/images/heroes/business-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#06b6d4","agent_keys":true,"channels":["f2f2bd670b66d01b03cc701e16e1c47920406e337aae49c47f5e3af122960e47"]}]'
ADMIN_PUBKEYS = "bfcf20d472f0fb143b23cb5be3fa0a040d42176b71f73ca272f6912b1d62a452"
DEVICE_KEYS_ENABLED = "false"
# Per-pod default in MiB (kit default 50). Largest imported pod needs POD_QUOTA_MB_NEEDED (RUNBOOK §6 prints it); 2048 as on the pilot.
POD_QUOTA_MB = "2048"
# Sealed search index publisher besides admins (pods/<archivist>/media/zones/zone2/search/).
SEARCH_ARCHIVISTS = "5ec4b75971fd029374e321b581850606071f64ae06df838d80c80808e3059b07,bfcf20d472f0fb143b23cb5be3fa0a040d42176b71f73ca272f6912b1d62a452"
PAY_ENABLED = "true"
PAY_COST_SATS = "1"
PAY_TOKEN_TICKER = "DREAM"
PAY_TOKEN_RATE = "10"
PAY_TOKEN_SUPPLY = "1000000"
