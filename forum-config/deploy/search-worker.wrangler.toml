# v2 search worker — OPTIONAL and NOT PROVISIONED (Cloudflare listing 2026-11-26: no dreamlab-search-api-v2 worker, no
# dreamlab-vectors-v2 bucket, no v2 SEARCH_CONFIG namespace). The SEARCH_CONFIG id below is a deliberate placeholder: it FAILS
# forum-config's deploy_config validator and workers-deploy.yml's placeholder guard, and the worker is out of the CI deploy
# matrix and the nightly backup. To provision: create the bucket and namespace, paste the 32-hex id here, then add the worker to
# workers-deploy.yml and its bindings to scripts/backup/forum-backup.sh (check-config-mirrors.mjs will demand both).
# The pilot-kit client no longer calls /embed or /search (c03d736: sealed search runs in the browser from
# pod objects), and both endpoints are NIP-98-admin-only (d3bef5b). Deploy only if something else needs it. No [ai] binding (no Workers
# AI), no JEV rerank, no EMBED_URL (the LAN Xinference is not reachable from Cloudflare): the worker falls back to its hash backend.
name = "dreamlab-search-api-v2"
main = "build/worker/shim.mjs"
compatibility_date = "2025-09-01"

[build]
command = "worker-build --release"

[[r2_buckets]]
binding = "VECTORS"
bucket_name = "dreamlab-vectors-v2"

[[kv_namespaces]]
binding = "SEARCH_CONFIG"
id = "<SEARCH_CONFIG_V2_KV_ID>"

[[d1_databases]]
binding = "REPLAY_DB"
database_name = "dreamlab-auth-v2"
database_id = "a53a49db-beec-4ee5-b09b-a2573923d21f"

[vars]
JEV_SEARCH_RERANK = "1"
JEV_ENDPOINT = "https://api.typesafe.ai/v1/systemone"
JEV_MODEL = "jev-latest"
JEV_API_KEY_NAME = "TYPESAFE_API_KEY"
# Supply TYPESAFE_API_KEY as a Worker secret; never put its value in this file.
ALLOWED_ORIGIN = "https://dreamlab-ai.com"
ALLOWED_ORIGINS = "https://dreamlab-ai.com,https://thedreamlab.uk"
RVF_STORE_KEY = "dreamlab-v2.rvf"
ADMIN_PUBKEYS = "bfcf20d472f0fb143b23cb5be3fa0a040d42176b71f73ca272f6912b1d62a452"

[triggers]
crons = []
