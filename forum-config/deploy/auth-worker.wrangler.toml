# v2 auth worker. Secrets (RUNBOOK §9, wrangler secret put --name dreamlab-auth-api-v2): PRF_SERVER_SECRET (NEW random 32 bytes:
# 0 passkeys exist on live, nothing to preserve), ADMIN_PUBKEYS (= bfcf20d472f0fb143b23cb5be3fa0a040d42176b71f73ca272f6912b1d62a452; secret ONLY, never also a plaintext var),
# WELCOME_MASTER_KEY (new random). No TYPESAFE_API_KEY (no JEV). NATIVE_POD_* optional (native tier not used).
name = "dreamlab-auth-api-v2"
main = "build/worker/shim.mjs"
compatibility_date = "2025-09-01"

[build]
command = "worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "dreamlab-auth-v2"
database_id = "a53a49db-beec-4ee5-b09b-a2573923d21f"
migrations_dir = "migrations"

[[d1_databases]]
binding = "RELAY_DB"
database_name = "dreamlab-relay-v2"
database_id = "eb33cf2f-44db-433c-9771-6db850d8b64c"

[[kv_namespaces]]
binding = "SESSIONS"
id = "40fdb0ce2d814f77b3db9d7b922ff579"

[[kv_namespaces]]
binding = "KV"
id = "40fdb0ce2d814f77b3db9d7b922ff579"

[[kv_namespaces]]
binding = "POD_META"
id = "d4c2d7bc103e4ce697340fa6962d2728"

[[kv_namespaces]]
binding = "ADMIN_KV"
id = "36c5f8d2157b4b3e8ef53c47c7fb68f1"

[[r2_buckets]]
binding = "PODS"
bucket_name = "dreamlab-pods-v2"

[vars]
JEV_RATIONALE_CHECK = "1"   # System One advisory, as on live; cloud route needs the TYPESAFE_API_KEY secret
RP_ID = "dreamlab-ai.com"
RP_NAME = "DreamLab Community"
# ONE origin for CORS and the WebAuthn origin check (http.rs:22, webauthn.rs:1323). Test: forum-v2. At the switch: https://dreamlab-ai.com
# and redeploy this worker (RUNBOOK §18, [WRITE]).
EXPECTED_ORIGIN = "https://dreamlab-ai.com"
ZONE_CONFIG = '[{"id":"zone1","slug":"welcome","display_name":"Welcome","required_cohorts":[],"write_cohorts":["members","agent"],"banner_image_url":"/images/heroes/lake-district-dawn.webp","visibility":"public","encrypted":false,"accent_hex":"#22c55e"},{"id":"zone2","slug":"minimoonoir","display_name":"Minimoonoir","required_cohorts":["zone2","minimoonoir"],"banner_image_url":"/images/heroes/minimoonoir-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#3b82f6","section_order":["zone2-rants"]},{"id":"zone3","kanban":true,"slug":"family","display_name":"Family","required_cohorts":["zone3","family"],"banner_image_url":"/images/heroes/family-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#f59e0b"},{"id":"zone4","kanban":true,"slug":"dreamlab","display_name":"DreamLab","required_cohorts":["zone4","dreamlab"],"banner_image_url":"/images/heroes/business-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#a855f7","agent_keys":true}]'
NIP05_RESOLVER_MODE = "federated"
POD_BASE_URL = "https://dreamlab-pod-api-v2.solitary-paper-764d.workers.dev"
DEVICE_KEYS_ENABLED = "false"
RECIPIENT_KEYS_ENABLED = "false"
