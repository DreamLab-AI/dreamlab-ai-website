# v2 relay — DreamLab forum v2 (go-live 2026-11). Deployed FROM THIS CONTAINER with a scoped token (RUNBOOK §9), never by
# workers-deploy.yml. Copy over kit/crates/nostr-bbs-relay-worker/wrangler.toml in the RELEASE worktree before `wrangler deploy`.
# Placeholders <...> are filled from the create commands' output (RUNBOOK §8).
name = "dreamlab-nostr-relay-v2"
main = "build/worker/shim.mjs"
compatibility_date = "2025-09-01"

[build]
command = "worker-build --release"

[vars]
# System One advisory integration, as on live (re-up 2026-11-25: parity with the live overlay). Errors retain the existing result.
JEV_TRIAGE = "1"
JEV_ENDPOINT = "https://api.typesafe.ai/v1/systemone"
JEV_MODEL = "jev-latest"
JEV_API_KEY_NAME = "TYPESAFE_API_KEY"
# Supply TYPESAFE_API_KEY as a Worker secret; never put its value in this file.
ENCRYPTION_ENABLED = "true"
RELAY_NAME = "DreamLab Nostr Relay"
# NIP-42 relay tag: must be EXACTLY the URL clients connect to.
RELAY_URL = "wss://dreamlab-nostr-relay-v2.solitary-paper-764d.workers.dev"
# Test origin first; dreamlab-ai.com is listed from the start so the switch needs no relay redeploy.
ALLOWED_ORIGIN = "https://dreamlab-ai.com"
ALLOWED_ORIGINS = "https://dreamlab-ai.com,https://thedreamlab.uk"
RATE_LIMIT_MSGS_PER_SEC = "30"
# Byte-identical to the live overlay (forum-config/dreamlab.toml [[zones]]). Search modes are DERIVED by the kit (Zone::effective_search:
# public zone1 -> off, encrypted zones -> sealed), so no explicit `search` field: the website's mirror check does not project one.
ZONE_CONFIG = '[{"id":"zone1","slug":"welcome","display_name":"Welcome","required_cohorts":[],"write_cohorts":["members","agent"],"banner_image_url":"/images/heroes/lake-district-dawn.webp","visibility":"public","encrypted":false,"accent_hex":"#22c55e"},{"id":"zone2","slug":"minimoonoir","display_name":"Minimoonoir","required_cohorts":["zone2","minimoonoir"],"banner_image_url":"/images/heroes/minimoonoir-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#3b82f6","section_order":["zone2-rants"]},{"id":"zone3","kanban":true,"slug":"family","display_name":"Family","required_cohorts":["zone3","family"],"banner_image_url":"/images/heroes/family-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#f59e0b"},{"id":"zone4","kanban":true,"slug":"dreamlab","display_name":"DreamLab","required_cohorts":["zone4","dreamlab"],"banner_image_url":"/images/heroes/business-hero.webp","visibility":"locked","encrypted":true,"accent_hex":"#a855f7","agent_keys":true}]'
# beema only (BRIEF). /api/check-whitelist reads D1 only: the dump carries beema's whitelist row with is_admin=1 as well.
ADMIN_PUBKEYS = "bfcf20d472f0fb143b23cb5be3fa0a040d42176b71f73ca272f6912b1d62a452"
# React contact / Talk-to-AI DMs stay on the OLD relay unless the operator moves them (RUNBOOK §17). Until then none here.
INGRESS_RECIPIENTS = '[{"label":"site-inbox","pubkey":"11ed64225dd5e2c5e18f61ad43d5ad9272d08739d3a20dd25886197b0738663c","role":"primary","authorised_by":"6407eed80e2a8646e41a5ddba0ae6619425fc54af40e2b30482b9623c682425a"},{"label":"junkiejarvis","pubkey":"2de44d5622eef79519ac078f6e227a85aecbaefd561e4e50c5f51dfadbf916e9","role":"agent","authorised_by":"6407eed80e2a8646e41a5ddba0ae6619425fc54af40e2b30482b9623c682425a"},{"label":"website-info","pubkey":"4ed429aa7f30d6e63c41be50685cffeb03cd7b07e37d37a0c4ae5321e642aad7","role":"copy","authorised_by":"6407eed80e2a8646e41a5ddba0ae6619425fc54af40e2b30482b9623c682425a"}]'
DEVICE_KEYS_ENABLED = "false"
AUTH_MODE = "nip42"
# Web Push off for the test (no subscriptions migrate). To enable: same VAPID pair as live (VAPID_PRIVATE_KEY secret) + these vars.
PUSH_ENABLED = "false"
MESH_MODE = "standalone"
MESH_PEER_RELAYS = ""
MESH_FEDERATED_KINDS = "1,1059,30001,30050,30910,31400,31401,31402,31403,31404,31405"
MESH_ALLOWED_REMOTE_DIDS = ""

[[d1_databases]]
binding = "DB"
database_name = "dreamlab-relay-v2"
database_id = "eb33cf2f-44db-433c-9771-6db850d8b64c"

[[d1_databases]]
binding = "REPLAY_DB"
database_name = "dreamlab-auth-v2"
database_id = "a53a49db-beec-4ee5-b09b-a2573923d21f"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "NostrRelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NostrRelayDO"]

# The scheduled handler runs advisory moderation triage.
[triggers]
crons = ["*/5 * * * *"]
