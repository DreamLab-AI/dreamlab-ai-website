<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="al-title al-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="al-title">The Claude Code agent loop</title>
  <desc id="al-desc">You describe a task, Claude analyses the project and proposes actions, you approve or modify, then Claude executes and shows results — feeding back into the next request.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="304" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THE AGENT LOOP</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="112" width="160" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="128" y="148" font-size="15" font-weight="600" fill="#F5F5F5">You describe</text>
    <text x="128" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">natural language</text>

    <rect x="264" y="112" width="160" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="344" y="148" font-size="15" font-weight="600" fill="#F5F5F5">Claude analyses</text>
    <text x="344" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">reads files</text>

    <rect x="480" y="112" width="160" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="560" y="148" font-size="15" font-weight="600" fill="#F5F5F5">Proposes actions</text>
    <text x="560" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">edits · commands</text>

    <rect x="696" y="112" width="160" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="776" y="148" font-size="15" font-weight="600" fill="#F5F5F5">You approve</text>
    <text x="776" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">the permission gate</text>

    <rect x="360" y="232" width="240" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="480" y="258" font-size="15" font-weight="600" fill="#F5F5F5">Execute &amp; show results</text>
    <text x="480" y="278" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">diffs · test output</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M208,152 C228,152 244,152 260,152" marker-end="url(#arr)"/>
    <path d="M424,152 C444,152 460,152 476,152" marker-end="url(#arr)"/>
    <path d="M640,152 C660,152 676,152 692,152" marker-end="url(#arr)"/>
    <path d="M776,192 C776,232 660,244 604,256" marker-end="url(#arr)"/>
    <path d="M360,260 C220,256 128,236 128,196" marker-end="url(#arr)"/>
  </g>
  <text x="216" y="240" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">next request</text>
</svg>
