<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="hp-title hp-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="hp-title">Three hook design patterns</title>
  <desc id="hp-desc">Gatekeeper pattern: PreToolUse validates then allows or blocks. Cleanup pattern: PostToolUse formats, lints, then logs. Observer pattern: SessionStart, Stop and SessionEnd each log then notify, without interfering with the session.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="344" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">HOOK DESIGN PATTERNS</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- Gatekeeper row -->
  <text x="48" y="106" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">GATEKEEPER · PreToolUse</text>
  <g text-anchor="middle">
    <rect x="48" y="116" width="164" height="56" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="130" y="150" font-size="14" font-weight="600" fill="#F5F5F5">PreToolUse</text>

    <rect x="272" y="116" width="164" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="354" y="150" font-size="14" font-weight="600" fill="#F5F5F5">Validate</text>

    <rect x="496" y="116" width="220" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="606" y="150" font-size="14" font-weight="600" fill="#F5F5F5">Allow or Block</text>
  </g>
  <g fill="none" stroke="#F59E0B" stroke-width="1.2">
    <path d="M212,144 C232,144 252,144 268,144" marker-end="url(#arr-accent)"/>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M436,144 C456,144 476,144 492,144" marker-end="url(#arr)"/>
  </g>

  <!-- Cleanup row -->
  <text x="48" y="206" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">CLEANUP · PostToolUse</text>
  <g text-anchor="middle">
    <rect x="48" y="216" width="164" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="130" y="250" font-size="14" font-weight="600" fill="#F5F5F5">PostToolUse</text>

    <rect x="272" y="216" width="164" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="354" y="250" font-size="14" font-weight="600" fill="#F5F5F5">Format</text>

    <rect x="496" y="216" width="164" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="578" y="250" font-size="14" font-weight="600" fill="#F5F5F5">Lint</text>

    <rect x="720" y="216" width="164" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="802" y="250" font-size="14" font-weight="600" fill="#F5F5F5">Log</text>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M212,244 C232,244 252,244 268,244" marker-end="url(#arr)"/>
    <path d="M436,244 C456,244 476,244 492,244" marker-end="url(#arr)"/>
    <path d="M660,244 C680,244 700,244 716,244" marker-end="url(#arr)"/>
  </g>

  <!-- Observer row -->
  <text x="48" y="306" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">OBSERVER · SessionStart / Stop / SessionEnd</text>
  <g text-anchor="middle">
    <rect x="48" y="316" width="164" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="130" y="339" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Start · Stop · End</text>

    <rect x="272" y="316" width="164" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="354" y="339" font-size="13" font-weight="600" fill="#F5F5F5">Log</text>

    <rect x="496" y="316" width="164" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="578" y="339" font-size="13" font-weight="600" fill="#F5F5F5">Notify</text>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M212,334 C232,334 252,334 268,334" marker-end="url(#arr)"/>
    <path d="M436,334 C456,334 476,334 492,334" marker-end="url(#arr)"/>
  </g>
</svg>
