<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Multi-root workspace</title>
  <desc id="dg-desc">One workspace file groups the frontend React app, the Node.js backend API and a shared TypeScript types folder.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="312" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">MULTI-ROOT WORKSPACE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="352" y="96" width="256" height="72" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="128" font-size="15" font-weight="600" fill="#F5F5F5">Workspace: my-app</text>
    <text x="480" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">my-app.code-workspace</text>
  </g>

  <g text-anchor="middle">
    <rect x="80" y="224" width="240" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="200" y="256" font-size="14" font-weight="600" fill="#F5F5F5">frontend/</text>
    <text x="200" y="280" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">React app</text>

    <rect x="360" y="224" width="240" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="256" font-size="14" font-weight="600" fill="#F5F5F5">backend/</text>
    <text x="480" y="280" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Node.js API</text>

    <rect x="640" y="224" width="240" height="72" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="760" y="256" font-size="14" font-weight="600" fill="#F5F5F5">shared/</text>
    <text x="760" y="280" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">TypeScript types</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M424,168 C352,188 268,200 216,220" marker-end="url(#arr)"/>
    <path d="M480,168 C480,188 480,204 480,220" marker-end="url(#arr)"/>
    <path d="M536,168 C608,188 692,200 744,220" marker-end="url(#arr)"/>
  </g>
</svg>
