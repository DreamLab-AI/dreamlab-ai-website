<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Debugging in VS Code</title>
  <desc id="dg-desc">The debug view groups the toolbar, variables, watch, call stack and breakpoints; debug adapters connect it to Node.js, Python, browsers and native code.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="312" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">DEBUGGING IN VS CODE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="400" height="184" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="248" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Debug View</text>
    <text x="248" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#F59E0B">ONE PLACE TO INSPECT</text>
    <text x="248" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">debug toolbar · variables</text>
    <text x="248" y="220" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">watch · call stack</text>
    <text x="248" y="244" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">breakpoints</text>

    <rect x="512" y="104" width="400" height="184" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="712" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Debug Adapters</text>
    <text x="712" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">ONE PROTOCOL, ANY RUNTIME</text>
    <text x="712" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Node.js · Python</text>
    <text x="712" y="220" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Chrome / Edge</text>
    <text x="712" y="244" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">C++ · Rust</text>
  </g>

  <path d="M448,196 C468,196 488,196 508,196" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>
