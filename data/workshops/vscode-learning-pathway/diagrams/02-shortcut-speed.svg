<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Mouse versus keyboard workflow</title>
  <desc id="dg-desc">The mouse path takes three steps — find the menu, click the option, execute. A keyboard shortcut executes in one.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="296" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">WHY SHORTCUTS MATTER</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <text x="48" y="120" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="0.12em" fill="#6B7280">MOUSE — SLOW</text>
  <g text-anchor="middle">
    <rect x="48" y="132" width="160" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="128" y="166" font-size="14" font-weight="600" fill="#F5F5F5">Find menu</text>
    <rect x="248" y="132" width="160" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="328" y="166" font-size="14" font-weight="600" fill="#F5F5F5">Click option</text>
  </g>

  <text x="48" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="0.12em" fill="#6B7280">KEYBOARD — FAST</text>
  <g text-anchor="middle">
    <rect x="48" y="240" width="200" height="56" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="148" y="274" font-size="14" font-weight="600" fill="#F5F5F5">Press shortcut</text>
  </g>

  <g text-anchor="middle">
    <rect x="672" y="184" width="192" height="72" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="768" y="216" font-size="15" font-weight="600" fill="#F5F5F5">Execute</text>
    <text x="768" y="240" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">same result</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M208,160 C220,160 232,160 244,160" marker-end="url(#arr)"/>
    <path d="M408,160 C520,160 600,180 668,208" marker-end="url(#arr)"/>
  </g>
  <path d="M248,268 C440,268 580,252 668,232" fill="none" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arr-accent)"/>
  <text x="440" y="252" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#F59E0B">one step</text>
  <text x="440" y="148" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">three steps</text>
</svg>
