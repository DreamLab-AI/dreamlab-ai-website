<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">AI integration types</title>
  <desc id="dg-desc">Three ways to add AI to VS Code: cloud-based services, hybrid tools that mix providers, and fully local models for privacy.</desc>
  <rect x="8" y="8" width="944" height="296" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">AI INTEGRATION TYPES</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="272" height="160" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="184" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Cloud-Based</text>
    <text x="184" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">GitHub Copilot</text>
    <text x="184" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Codeium</text>
    <text x="184" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Tabnine Cloud</text>
    <text x="184" y="244" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">code leaves your machine</text>

    <rect x="344" y="104" width="272" height="160" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Hybrid</text>
    <text x="480" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Continue</text>
    <text x="480" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Cody</text>
    <text x="480" y="244" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">choose provider per task</text>

    <rect x="640" y="104" width="272" height="160" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="776" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Local</text>
    <text x="776" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Ollama + Continue</text>
    <text x="776" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">local models</text>
    <text x="776" y="244" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#F59E0B">private — nothing leaves</text>
  </g>
</svg>
