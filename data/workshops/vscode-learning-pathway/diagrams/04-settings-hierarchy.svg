<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Settings hierarchy</title>
  <desc id="dg-desc">User settings apply everywhere, workspace settings override them for a project, and folder settings win in multi-root workspaces.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="272" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">SETTINGS HIERARCHY</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="120" width="256" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="176" y="152" font-size="15" font-weight="600" fill="#F5F5F5">User Settings</text>
    <text x="176" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">global · all projects</text>
    <text x="176" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">User/settings.json</text>

    <rect x="352" y="120" width="256" height="96" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="152" font-size="15" font-weight="600" fill="#F5F5F5">Workspace Settings</text>
    <text x="480" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">this project only</text>
    <text x="480" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">.vscode/settings.json</text>

    <rect x="656" y="120" width="256" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="784" y="152" font-size="15" font-weight="600" fill="#F5F5F5">Folder Settings</text>
    <text x="784" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">per folder, multi-root</text>
    <text x="784" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">.vscode/settings.json</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M304,168 C320,168 332,168 348,168" marker-end="url(#arr)"/>
    <path d="M608,168 C624,168 636,168 652,168" marker-end="url(#arr)"/>
  </g>
  <text x="308" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">overridden</text>
  <text x="612" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">overridden</text>
  <text x="48" y="252" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">more specific settings win →</text>
</svg>
