<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Profiles for different work</title>
  <desc id="dg-desc">Separate profiles keep an all-purpose default alongside tailored setups for web development, Python and distraction-free writing.</desc>
  <rect x="8" y="8" width="944" height="264" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">ONE EDITOR, MANY PROFILES</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="112" width="200" height="120" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="148" y="152" font-size="14" font-weight="600" fill="#F5F5F5">Default</text>
    <text x="148" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">all-purpose</text>

    <rect x="264" y="112" width="200" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="364" y="152" font-size="14" font-weight="600" fill="#F5F5F5">Web Dev</text>
    <text x="364" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">React · ESLint</text>
    <text x="364" y="204" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Prettier</text>

    <rect x="480" y="112" width="200" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="580" y="152" font-size="14" font-weight="600" fill="#F5F5F5">Python</text>
    <text x="580" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Pylance · Jupyter</text>
    <text x="580" y="204" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Black</text>

    <rect x="696" y="112" width="216" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="804" y="152" font-size="14" font-weight="600" fill="#F5F5F5">Writing</text>
    <text x="804" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Markdown · grammar</text>
    <text x="804" y="204" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">minimal UI</text>
  </g>
</svg>
