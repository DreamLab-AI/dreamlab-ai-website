<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">VS Code architecture</title>
  <desc id="dg-desc">The user interface drives the editor core; an isolated extension host runs language servers, AI services and remote connections.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="344" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">HOW VS CODE IS BUILT</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="168" width="160" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="128" y="196" font-size="14" font-weight="600" fill="#F5F5F5">User Interface</text>
    <text x="128" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">editor · panels</text>

    <rect x="256" y="168" width="160" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="336" y="196" font-size="14" font-weight="600" fill="#F5F5F5">Editor Core</text>
    <text x="336" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">text engine</text>

    <rect x="464" y="168" width="176" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="552" y="196" font-size="14" font-weight="600" fill="#F5F5F5">Extension Host</text>
    <text x="552" y="218" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">isolated process</text>
  </g>

  <g text-anchor="middle">
    <rect x="704" y="96" width="208" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="808" y="122" font-size="14" font-weight="600" fill="#F5F5F5">Language Servers</text>
    <text x="808" y="144" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">TypeScript · Python · Rust</text>

    <rect x="704" y="176" width="208" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="808" y="202" font-size="14" font-weight="600" fill="#F5F5F5">AI Services</text>
    <text x="808" y="224" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Copilot · Cody · local</text>

    <rect x="704" y="256" width="208" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="808" y="282" font-size="14" font-weight="600" fill="#F5F5F5">Remote Connections</text>
    <text x="808" y="304" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">SSH · containers · WSL</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M208,200 C224,200 236,200 252,200" marker-end="url(#arr)"/>
    <path d="M416,200 C432,200 444,200 460,200" marker-end="url(#arr)"/>
    <path d="M640,180 C664,164 676,144 700,132" marker-end="url(#arr)"/>
    <path d="M640,202 C660,204 680,204 700,206" marker-end="url(#arr)"/>
    <path d="M640,220 C664,236 676,256 700,272" marker-end="url(#arr)"/>
  </g>
</svg>
