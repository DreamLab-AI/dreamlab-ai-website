<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">GitLens features</title>
  <desc id="dg-desc">GitLens adds blame annotations, commit history, file history and branch comparison on top of the built-in Git support.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="296" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">GITLENS AT A GLANCE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="152" width="192" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="144" y="188" font-size="15" font-weight="600" fill="#F5F5F5">GitLens</text>
    <text x="144" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">git superpowers</text>
  </g>

  <g text-anchor="middle">
    <rect x="336" y="104" width="272" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="472" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Blame Annotations</text>
    <text x="472" y="160" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">inline blame · hover details</text>

    <rect x="640" y="104" width="272" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="776" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Commit History</text>
    <text x="776" y="160" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">visual history · details · search</text>

    <rect x="336" y="208" width="272" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="472" y="240" font-size="14" font-weight="600" fill="#F5F5F5">File History</text>
    <text x="472" y="264" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">every change to one file</text>

    <rect x="640" y="208" width="272" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="776" y="240" font-size="14" font-weight="600" fill="#F5F5F5">Branch Comparison</text>
    <text x="776" y="264" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">diff any two branches</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M240,176 C276,164 296,152 332,144" marker-end="url(#arr)"/>
    <path d="M240,208 C276,220 296,232 332,240" marker-end="url(#arr)"/>
  </g>
</svg>
