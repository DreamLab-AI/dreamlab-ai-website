<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">VS Code as a platform</title>
  <desc id="dg-desc">A lightweight, open-source core exposes an extension API that powers AI integration, remote development and custom tooling.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="400" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">VS CODE AS A PLATFORM</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="352" y="96" width="256" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="128" font-size="15" font-weight="600" fill="#F5F5F5">VS Code Core</text>
    <text x="480" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">fast · open source · cross-platform</text>

    <rect x="368" y="208" width="224" height="72" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="240" font-size="15" font-weight="600" fill="#F5F5F5">Extension API</text>
    <text x="480" y="264" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">70,000+ extensions</text>
  </g>

  <g text-anchor="middle">
    <rect x="80" y="320" width="240" height="68" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="200" y="348" font-size="14" font-weight="600" fill="#F5F5F5">AI Integration</text>
    <text x="200" y="372" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Copilot · Claude · local models</text>

    <rect x="360" y="320" width="240" height="68" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="348" font-size="14" font-weight="600" fill="#F5F5F5">Remote Development</text>
    <text x="480" y="372" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">SSH · containers · WSL</text>

    <rect x="640" y="320" width="240" height="68" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="760" y="348" font-size="14" font-weight="600" fill="#F5F5F5">Custom Tools</text>
    <text x="760" y="372" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">themes · linters · workflows</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M480,168 C480,184 480,192 480,204" marker-end="url(#arr)"/>
    <path d="M424,280 C360,296 260,300 212,316" marker-end="url(#arr)"/>
    <path d="M480,280 C480,296 480,304 480,316" marker-end="url(#arr)"/>
    <path d="M536,280 C600,296 700,300 748,316" marker-end="url(#arr)"/>
  </g>
</svg>
