<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="d02h-title d02h-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d02h-title">VS Code settings hierarchy</title>
  <desc id="d02h-desc">Settings cascade from the most general to the most specific: defaults, then user settings, then workspace settings, then folder settings — the most specific layer wins.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="424" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">SETTINGS HIERARCHY</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">
    <rect x="368" y="96" width="224" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="130">Default settings</text>
    <rect x="368" y="184" width="224" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="218">User settings</text>
    <rect x="368" y="272" width="224" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="306">Workspace settings</text>
    <rect x="368" y="360" width="224" height="56" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="394">Folder settings</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <line x1="480" y1="152" x2="480" y2="176" marker-end="url(#arr)"/>
    <line x1="480" y1="240" x2="480" y2="264" marker-end="url(#arr)"/>
    <line x1="480" y1="328" x2="480" y2="352" marker-end="url(#arr)"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="0.18em" fill="#6B7280">
    <text x="632" y="128">MOST GENERAL</text>
    <text x="632" y="392" fill="#F59E0B">MOST SPECIFIC — WINS</text>
  </g>
</svg>
