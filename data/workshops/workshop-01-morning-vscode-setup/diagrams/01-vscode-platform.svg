<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="d01p-title d01p-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d01p-title">VS Code as a universal document platform</title>
  <desc id="d01p-desc">Four faces of VS Code: a powerful text editor, an AI integration hub, an automation engine and a collaboration centre.</desc>
  <rect x="8" y="8" width="944" height="244" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">VS CODE — UNIVERSAL DOCUMENT PLATFORM</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="192" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="144" font-size="15" font-weight="600" fill="#F5F5F5">Text Editor</text>
    <text x="144" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">code · docs · notes</text>

    <rect x="272" y="104" width="192" height="96" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="368" y="144" font-size="15" font-weight="600" fill="#F5F5F5">AI Integration Hub</text>
    <text x="368" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">any model · context-aware</text>

    <rect x="496" y="104" width="192" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="144" font-size="15" font-weight="600" fill="#F5F5F5">Automation Engine</text>
    <text x="592" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">tasks · custom workflows</text>

    <rect x="720" y="104" width="192" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="816" y="144" font-size="15" font-weight="600" fill="#F5F5F5">Collaboration</text>
    <text x="816" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">git built-in · real-time</text>
  </g>
</svg>
