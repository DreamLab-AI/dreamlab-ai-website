    <line x1="376" y1="144" x2="408" y2="144" marker-end="url(#arr)"/>
    <line x1="568" y1="144" x2="600" y2="144" marker-end="url(#arr)"/>
    <line x1="760" y1="144" x2="792" y2="144" marker-end="url(#arr)"/>
