    <text x="684" y="150">Settings</text>
    <rect x="800" y="112" width="136" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="868" y="144">Pro</text>
    <text x="868" y="164">Environment</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
