<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="d02s-title d02s-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d02s-title">Environment setup flow</title>
  <desc id="d02s-desc">A fresh VS Code install gains essential extensions, AI assistants and tuned settings, ending in a production-ready professional environment.</desc>
  <defs>
