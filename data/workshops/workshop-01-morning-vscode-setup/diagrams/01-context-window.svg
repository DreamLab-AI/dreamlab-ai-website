<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="d01w-title d01w-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d01w-title">The AI context window</title>
  <desc id="d01w-desc">The current file, related files, project structure and recent changes all feed the AI context window, which gives the model the understanding it needs to make better suggestions.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="424" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">WHAT THE AI CAN SEE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- sources -->
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">
    <rect x="48" y="104" width="192" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="144" y="138">Current file</text>
    <rect x="272" y="104" width="192" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="368" y="138">Related files</text>
    <rect x="496" y="104" width="192" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="592" y="138">Project structure</text>
    <rect x="720" y="104" width="192" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="816" y="138">Recent changes</text>
  </g>

  <!-- converge -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M144,160 C144,208 372,204 412,232" marker-end="url(#arr)"/>
    <path d="M368,160 C368,196 428,200 448,224" marker-end="url(#arr)"/>
    <path d="M592,160 C592,196 532,200 512,224" marker-end="url(#arr)"/>
    <path d="M816,160 C816,208 588,204 548,232" marker-end="url(#arr)"/>
  </g>

  <!-- focal -->
  <g text-anchor="middle">
    <rect x="360" y="240" width="240" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="274" font-size="16" font-weight="600" fill="#F5F5F5">AI Context Window</text>
    <text x="480" y="298" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">how much the model sees</text>
  </g>

  <path d="M480,320 C480,336 480,340 480,352" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>

  <g text-anchor="middle">
    <rect x="368" y="356" width="224" height="52" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="388" font-size="14" font-weight="600" fill="#F5F5F5">Better suggestions</text>
  </g>
</svg>
