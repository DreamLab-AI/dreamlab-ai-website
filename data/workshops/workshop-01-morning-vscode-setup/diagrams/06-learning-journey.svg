    <rect x="32" y="104" width="152" height="84" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="108" y="138" font-size="13" font-weight="600" fill="#F5F5F5">Daily practice</text>
    <text x="108" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">30d · competent</text>

    <rect x="224" y="104" width="152" height="84" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="300" y="138" font-size="13" font-weight="600" fill="#F5F5F5">Build templates</text>
    <text x="300" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">60d · proficient</text>

    <rect x="416" y="104" width="152" height="84" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="492" y="138" font-size="13" font-weight="600" fill="#F5F5F5">Share knowledge</text>
    <text x="492" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">90d · expert</text>

    <rect x="608" y="104" width="152" height="84" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="684" y="138" font-size="13" font-weight="600" fill="#F5F5F5">Advanced use</text>
    <text x="684" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">6mo · master</text>

    <rect x="800" y="104" width="136" height="84" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="868" y="134" font-size="13" font-weight="600" fill="#F5F5F5">Community</text>
    <text x="868" y="152" font-size="13" font-weight="600" fill="#F5F5F5">contribution</text>
    <text x="868" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#F59E0B">give back</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
