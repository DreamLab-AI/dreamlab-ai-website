<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="ap-title ap-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ap-title">Three-service AI pipeline</title>
  <desc id="ap-desc">A user request hits the API gateway on port 8080, which health-checks and routes to the processor on 8001, which in turn calls the ingester on 8002 to transform text and return results.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="264" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THREE-SERVICE AI PIPELINE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="40"  y="120" width="180" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="130" y="164" font-size="14" font-weight="600" fill="#F5F5F5">User Request</text>

    <rect x="290" y="112" width="200" height="96" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="390" y="142" font-size="14" font-weight="600" fill="#F5F5F5">API Gateway</text>
    <text x="390" y="162" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">:8080</text>
    <text x="390" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">health check + routing</text>

    <rect x="570" y="120" width="176" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="658" y="150" font-size="14" font-weight="600" fill="#F5F5F5">Processor</text>
    <text x="658" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">:8001</text>

    <rect x="800" y="120" width="120" height="80" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="860" y="150" font-size="14" font-weight="600" fill="#F5F5F5">Ingester</text>
    <text x="860" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">:8002</text>
  </g>

  <g fill="none" stroke-width="1.2">
    <path d="M220,160 C250,160 260,160 290,160" stroke="#38BDF8" marker-end="url(#arr-sky)"/>
    <path d="M490,160 C520,160 540,160 570,160" stroke="#9CA3AF" marker-end="url(#arr)"/>
    <path d="M746,160 C766,160 780,160 800,160" stroke="#9CA3AF" marker-end="url(#arr)"/>
  </g>
</svg>
