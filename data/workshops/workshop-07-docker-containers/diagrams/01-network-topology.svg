<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="nt-title nt-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="nt-title">Docker network topology</title>
  <desc id="nt-desc">Ollama and Open WebUI both join a custom ai-network and reach each other by container name; the webui container also publishes port 3000 to the host.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="304" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">DOCKER NETWORK TOPOLOGY</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <rect x="288" y="96" width="384" height="140" rx="8" stroke-dasharray="4 3" stroke="rgba(255,255,255,0.20)" fill="none"/>
  <text x="480" y="116" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">ai-network</text>

  <g text-anchor="middle">
    <rect x="316" y="140" width="152" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="392" y="168" font-size="14" font-weight="600" fill="#F5F5F5">ollama</text>
    <text x="392" y="188" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">:11434</text>

    <rect x="492" y="140" width="152" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="568" y="168" font-size="14" font-weight="600" fill="#F5F5F5">webui</text>
    <text x="568" y="188" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">:3000</text>
  </g>

  <path d="M468,172 C476,172 484,172 492,172" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <g text-anchor="middle">
    <rect x="428" y="272" width="184" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(56,189,248,0.35)"/>
    <text x="520" y="297" font-size="13" font-weight="600" fill="#F5F5F5">Host: port 3000</text>
  </g>
  <path d="M568,236 C568,250 540,258 520,272" fill="none" stroke="#38BDF8" stroke-width="1.2" marker-end="url(#arr-sky)"/>
</svg>
