<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="dc-title dc-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dc-title">Dev Container architecture</title>
  <desc id="dc-desc">VS Code on the desktop connects over docker exec to a VS Code Server running inside the Docker container alongside the toolchain and extensions; the project folder is bind-mounted in and server ports are forwarded back to localhost.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="364" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">DEV CONTAINER ARCHITECTURE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- host side -->
  <g text-anchor="middle">
    <rect x="48" y="140" width="224" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="160" y="182" font-size="15" font-weight="600" fill="#F5F5F5">VS Code</text>
    <text x="160" y="206" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">on your desktop</text>
  </g>

  <!-- container group -->
  <rect x="440" y="96" width="472" height="232" rx="8" fill="none" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
  <text x="464" y="124" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.18em" fill="#6B7280">DOCKER CONTAINER</text>

  <g text-anchor="middle">
    <rect x="464" y="140" width="208" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="568" y="168" font-size="15" font-weight="600" fill="#F5F5F5">VS Code Server</text>
    <text x="568" y="190" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">headless, in-container</text>

    <rect x="688" y="140" width="200" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="788" y="168" font-size="14" font-weight="600" fill="#F5F5F5">Tools + extensions</text>
    <text x="788" y="190" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Python &#183; Node &#183; Git</text>

    <rect x="464" y="232" width="424" height="64" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="676" y="260" font-size="14" font-weight="600" fill="#F5F5F5">Your code (bind mount)</text>
    <text x="676" y="282" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">/workspaces/project</text>
  </g>

  <!-- links -->
  <g fill="none" stroke-width="1.2">
    <path d="M272,164 C336,160 400,160 456,164" stroke="#9CA3AF" marker-end="url(#arr)"/>
    <path d="M456,192 C400,196 336,196 280,192" stroke="#38BDF8" marker-end="url(#arr-sky)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" text-anchor="middle">
    <text x="364" y="148" fill="#9CA3AF">docker exec</text>
    <text x="364" y="216" fill="#38BDF8">forwarded ports &#8594; localhost</text>
  </g>
</svg>
