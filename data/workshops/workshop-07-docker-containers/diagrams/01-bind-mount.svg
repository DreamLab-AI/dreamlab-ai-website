<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="bm-title bm-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="bm-title">Bind mount: host to container</title>
  <desc id="bm-desc">A bind mount maps a directory on the host machine directly into the container, so changes made on the host appear instantly inside it.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="264" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">BIND MOUNT: HOST TO CONTAINER</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="76"  y="112" width="332" height="100" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="242" y="146" font-size="15" font-weight="600" fill="#F5F5F5">Host Machine</text>
    <text x="242" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">~/projects/ai/script.py</text>
    <text x="242" y="186" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">~/projects/ai/data/</text>

    <rect x="552" y="112" width="332" height="100" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="718" y="146" font-size="15" font-weight="600" fill="#F5F5F5">Container</text>
    <text x="718" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">/app/script.py</text>
    <text x="718" y="186" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">/app/data/</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M408,162 C460,150 500,150 552,162" marker-end="url(#arr)" marker-start="url(#arr)"/>
  </g>
  <text x="480" y="148" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">-v $(pwd):/app</text>
</svg>
