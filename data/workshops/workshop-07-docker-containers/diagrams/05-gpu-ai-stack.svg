<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="gp-title gp-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="gp-title">GPU container stack</title>
  <desc id="gp-desc">Layered stack for GPU AI containers: the container carries the CUDA runtime libraries and framework, the NVIDIA Container Toolkit injects the host driver at start, and only the driver lives on the host above the GPU hardware.</desc>

  <rect x="8" y="8" width="944" height="404" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">GPU CONTAINER STACK</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="240" y="96" width="480" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="124" font-size="15" font-weight="600" fill="#F5F5F5">AI container</text>
    <text x="480" y="146" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">PyTorch &#183; CUDA runtime libs &#183; no driver in the image</text>

    <rect x="240" y="168" width="480" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="192" font-size="14" font-weight="600" fill="#F5F5F5">NVIDIA Container Toolkit</text>
    <text x="480" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">injects host driver &#183; --gpus all</text>

    <rect x="240" y="232" width="480" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="262" font-size="14" font-weight="600" fill="#F5F5F5">Docker Engine</text>

    <rect x="240" y="288" width="480" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="312" font-size="14" font-weight="600" fill="#F5F5F5">Host NVIDIA driver</text>
    <text x="480" y="332" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">the only piece installed on the host</text>

    <rect x="240" y="352" width="480" height="48" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="480" y="382" font-size="14" font-weight="600" fill="#F5F5F5">GPU hardware</text>
  </g>
</svg>
