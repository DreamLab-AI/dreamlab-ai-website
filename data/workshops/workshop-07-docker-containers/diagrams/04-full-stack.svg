<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="fs-title fs-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fs-title">The full remote-development stack</title>
  <desc id="fs-desc">Your laptop's VS Code editor connects over SSH to a VS Code Server, which talks over Docker to a Dev Container on the remote server running Python, PyTorch and CUDA with GPU access.</desc>

  <defs>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="264" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THE FULL REMOTE-DEVELOPMENT STACK</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="40"  y="112" width="232" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="156" y="146" font-size="14" font-weight="600" fill="#F5F5F5">Your Laptop</text>
    <text x="156" y="166" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">VS Code (editor)</text>

    <rect x="364" y="112" width="232" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="146" font-size="14" font-weight="600" fill="#F5F5F5">VS Code Server</text>
    <text x="480" y="166" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">on the remote host</text>

    <rect x="688" y="112" width="232" height="88" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="804" y="140" font-size="14" font-weight="600" fill="#F5F5F5">Dev Container</text>
    <text x="804" y="160" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">Python 3.11 · PyTorch + CUDA</text>
    <text x="804" y="178" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">GPU access</text>
  </g>

  <g fill="none" stroke="#38BDF8" stroke-width="1.2">
    <path d="M272,156 C300,156 336,156 364,156" marker-end="url(#arr-sky)"/>
    <path d="M596,156 C624,156 660,156 688,156" marker-end="url(#arr-sky)"/>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#38BDF8">
    <text x="318" y="144">SSH</text>
    <text x="642" y="144">Docker</text>
  </g>
</svg>
