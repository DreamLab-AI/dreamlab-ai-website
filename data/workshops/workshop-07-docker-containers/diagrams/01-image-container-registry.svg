<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="ir-title ir-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ir-title">Registry, image and containers</title>
  <desc id="ir-desc">An image is pulled from a registry such as Docker Hub, then docker run starts independent containers from that single read-only layered image.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="344" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">FROM REGISTRY TO RUNNING CONTAINER</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="136" width="200" height="88" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="148" y="174" font-size="15" font-weight="600" fill="#F5F5F5">Registry</text>
    <text x="148" y="198" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Docker Hub &#183; ghcr.io</text>

    <rect x="344" y="136" width="224" height="88" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="456" y="174" font-size="15" font-weight="600" fill="#F5F5F5">Image</text>
    <text x="456" y="198" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">read-only, cached layers</text>

    <rect x="664" y="88" width="248" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="788" y="112" font-size="14" font-weight="600" fill="#F5F5F5">Container 1</text>
    <text x="788" y="132" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">analysis script</text>

    <rect x="664" y="152" width="248" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="788" y="176" font-size="14" font-weight="600" fill="#F5F5F5">Container 2</text>
    <text x="788" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Jupyter notebook</text>

    <rect x="664" y="216" width="248" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="788" y="240" font-size="14" font-weight="600" fill="#F5F5F5">Container 3</text>
    <text x="788" y="260" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">test run</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M248,180 C280,180 308,180 336,180" marker-end="url(#arr)"/>
    <path d="M568,164 C608,148 624,128 656,118" marker-end="url(#arr)"/>
    <path d="M568,180 C600,180 624,180 656,180" marker-end="url(#arr)"/>
    <path d="M568,196 C608,212 624,232 656,242" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">
    <text x="296" y="168">docker pull</text>
    <text x="616" y="308">docker run &#8212; each container is independent</text>
  </g>
</svg>
