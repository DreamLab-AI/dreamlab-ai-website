<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="ic-title ic-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ic-title">One image, many containers</title>
  <desc id="ic-desc">A single image such as python:3.11 spawns several independent running containers — an analysis script, a Jupyter notebook, and a test run.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="304" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">ONE IMAGE, MANY CONTAINERS</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="384" y="100" width="192" height="60" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="134" font-size="15" font-weight="600" fill="#F5F5F5">python:3.11</text>
    <text x="480" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">image</text>

    <rect x="76"  y="228" width="220" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="186" y="256" font-size="14" font-weight="600" fill="#F5F5F5">Container 1</text>
    <text x="186" y="276" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">analysis script</text>

    <rect x="370" y="228" width="220" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="256" font-size="14" font-weight="600" fill="#F5F5F5">Container 2</text>
    <text x="480" y="276" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Jupyter notebook</text>

    <rect x="664" y="228" width="220" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="774" y="256" font-size="14" font-weight="600" fill="#F5F5F5">Container 3</text>
    <text x="774" y="276" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">test run</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M420,160 C300,190 220,200 186,228" marker-end="url(#arr)"/>
    <path d="M480,160 C480,190 480,200 480,228" marker-end="url(#arr)"/>
    <path d="M540,160 C660,190 740,200 774,228" marker-end="url(#arr)"/>
  </g>
</svg>
