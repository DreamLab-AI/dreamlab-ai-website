      <text x="144" y="216">IDE tools</text>
      <text x="144" y="240">authentication</text>
    </g>

    <rect x="272" y="104" width="192" height="176" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="368" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Practical Skills</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">
      <text x="368" y="168">effective prompting</text>
      <text x="368" y="192">CLAUDE.md / AGENTS.MD</text>
      <text x="368" y="216">task management</text>
      <text x="368" y="240">multi-file editing</text>
    </g>

    <rect x="496" y="104" width="192" height="176" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Advanced</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">
