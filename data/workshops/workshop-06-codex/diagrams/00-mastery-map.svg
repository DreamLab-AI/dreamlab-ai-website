    <rect x="720" y="104" width="192" height="176" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="816" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Strategic</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">
      <text x="816" y="168">tool selection</text>
