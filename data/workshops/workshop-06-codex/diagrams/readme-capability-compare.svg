<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">How the leading tools compare</title>
  <desc id="dg-desc">Claude Code leads SWE-bench with excellent multi-file editing and CLAUDE.md, MCP and hooks; Codex CLI is open source and sandboxed with strong multi-file editing; Cursor offers fast, native IDE integration; Copilot brings broad language support and the GitHub ecosystem.</desc>

  <rect x="8" y="8" width="944" height="296" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">CAPABILITY SNAPSHOT</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="192" height="160" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="144" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Claude Code</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#F59E0B">
      <text x="144" y="168">SWE-bench leader</text>
      <text x="144" y="192">multi-file: excellent</text>
      <text x="144" y="216">CLAUDE.md · MCP · hooks</text>
    </g>

    <rect x="264" y="104" width="192" height="160" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="360" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Codex CLI</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
      <text x="360" y="168">strong multi-file</text>
      <text x="360" y="192">open source</text>
      <text x="360" y="216">sandboxed runs</text>
    </g>

    <rect x="480" y="104" width="192" height="160" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="576" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Cursor</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
      <text x="576" y="168">fast IDE integration</text>
      <text x="576" y="192">Composer: good</text>
      <text x="576" y="216">native IDE feel</text>
    </g>

    <rect x="696" y="104" width="192" height="160" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="792" y="136" font-size="14" font-weight="600" fill="#F5F5F5">Copilot</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
      <text x="792" y="168">broad language support</text>
      <text x="792" y="192">Workspace: good</text>
      <text x="792" y="216">GitHub ecosystem</text>
    </g>
  </g>
</svg>
