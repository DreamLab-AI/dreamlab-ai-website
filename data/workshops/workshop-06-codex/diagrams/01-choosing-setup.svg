<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Choosing your AI coding setup</title>
  <desc id="dg-desc">Pick by workflow: terminal-first developers choose Claude Code (full-featured) or Codex CLI (open source); IDE-native developers choose Cursor, Copilot or Continue.dev; chat and exploration suits ChatGPT or Claude.ai.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="424" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">CHOOSING YOUR SETUP</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <path d="M480,92 L556,140 L480,188 L404,140 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)" stroke-linejoin="round"/>
    <text x="480" y="136" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">how do you</text>
    <text x="480" y="150" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">work?</text>

    <rect x="48" y="248" width="256" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="176" y="276" font-size="14" font-weight="600" fill="#F5F5F5">Claude Code</text>
    <text x="176" y="298" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">full-featured agent</text>

    <rect x="48" y="336" width="256" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="176" y="364" font-size="14" font-weight="600" fill="#F5F5F5">Codex CLI</text>
    <text x="176" y="386" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">open source</text>

    <rect x="352" y="248" width="256" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="276" font-size="14" font-weight="600" fill="#F5F5F5">Cursor</text>
    <text x="480" y="298" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">premium VS Code fork</text>

    <rect x="352" y="336" width="256" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="364" font-size="14" font-weight="600" fill="#F5F5F5">Copilot · Continue</text>
    <text x="480" y="386" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">in your existing IDE</text>

    <rect x="656" y="248" width="256" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="784" y="276" font-size="14" font-weight="600" fill="#F5F5F5">ChatGPT · Claude.ai</text>
    <text x="784" y="298" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">exploration &amp; Q&amp;A</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M404,140 C260,160 200,200 180,240" marker-end="url(#arr)"/>
    <path d="M480,188 C480,208 480,220 480,240" marker-end="url(#arr)"/>
    <path d="M556,140 C700,160 760,200 780,240" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">
    <text x="252" y="184">terminal-first</text>
    <text x="480" y="216">IDE-native</text>
    <text x="716" y="184">chat &amp; explore</text>
  </g>
</svg>
