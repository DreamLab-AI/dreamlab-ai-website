<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Matching Claude models to task complexity</title>
  <desc id="dg-desc">Novel architecture work goes to Fable 5 (highest quality, highest cost); complex refactors to Opus 4.8, the default; routine features to Sonnet 4.6 via fast mode; simple bulk work to Haiku 4.5, the cheapest and fastest.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="424" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">MODEL BY TASK COMPLEXITY</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="216" width="176" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="136" y="244" font-size="15" font-weight="600" fill="#F5F5F5">Coding Task</text>
    <text x="136" y="266" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">what does it need?</text>

    <path d="M328,196 L380,248 L328,300 L276,248 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)" stroke-linejoin="round"/>
    <text x="328" y="252" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">complexity?</text>

    <rect x="464" y="96" width="400" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="664" y="122" font-size="14" font-weight="600" fill="#F5F5F5">Fable 5</text>
    <text x="664" y="144" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">top quality · top cost</text>

    <rect x="464" y="176" width="400" height="60" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="664" y="202" font-size="14" font-weight="600" fill="#F5F5F5">Opus 4.8</text>
    <text x="664" y="224" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">the default — most tasks</text>

    <rect x="464" y="256" width="400" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="664" y="282" font-size="14" font-weight="600" fill="#F5F5F5">Sonnet 4.6</text>
    <text x="664" y="304" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">fast &amp; cost-effective · /fast</text>

    <rect x="464" y="336" width="400" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="664" y="362" font-size="14" font-weight="600" fill="#F5F5F5">Haiku 4.5</text>
    <text x="664" y="384" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">cheapest · bulk operations</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M224,248 C244,248 252,248 268,248" marker-end="url(#arr)"/>
    <path d="M352,224 C408,152 424,136 456,128" marker-end="url(#arr)"/>
    <path d="M380,248 C412,236 428,216 456,208" marker-end="url(#arr)"/>
    <path d="M380,248 C412,260 428,280 456,288" marker-end="url(#arr)"/>
    <path d="M352,272 C408,344 424,360 456,368" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
    <text x="388" y="164">novel design</text>
    <text x="396" y="216">complex refactor</text>
    <text x="396" y="296">routine work</text>
    <text x="388" y="344">simple &amp; bulk</text>
  </g>
</svg>
