<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">How an agentic coding session runs</title>
  <desc id="dg-desc">The developer asks Claude Code to refactor a service. The agent reads project context and the codebase, plans the approach, edits files, runs tests via hooks, commits to git, then presents the diff and results.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="464" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">AGENTIC SESSION · SEQUENCE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="72" y="96" width="192" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="168" y="121" font-size="14" font-weight="600" fill="#F5F5F5">Developer</text>
    <rect x="300" y="96" width="192" height="40" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="396" y="121" font-size="14" font-weight="600" fill="#F5F5F5">Claude Code</text>
    <rect x="528" y="96" width="192" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="624" y="121" font-size="14" font-weight="600" fill="#F5F5F5">File System</text>
    <rect x="756" y="96" width="192" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="852" y="121" font-size="14" font-weight="600" fill="#F5F5F5">Git</text>
  </g>

  <g stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3">
    <line x1="168" y1="136" x2="168" y2="444"/>
    <line x1="396" y1="136" x2="396" y2="444"/>
    <line x1="624" y1="136" x2="624" y2="444"/>
    <line x1="852" y1="136" x2="852" y2="444"/>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <line x1="168" y1="176" x2="388" y2="176" marker-end="url(#arr)"/>
    <line x1="396" y1="220" x2="616" y2="220" marker-end="url(#arr)"/>
    <path d="M396,256 C440,256 440,284 404,284" marker-end="url(#arr)"/>
    <line x1="396" y1="324" x2="616" y2="324" marker-end="url(#arr)"/>
    <path d="M396,352 C440,352 440,380 404,380" marker-end="url(#arr)"/>
    <line x1="396" y1="416" x2="844" y2="416" marker-end="url(#arr)"/>
    <line x1="388" y1="444" x2="176" y2="444" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
    <text x="188" y="168">"refactor the user service"</text>
    <text x="416" y="212">read CLAUDE.md + codebase</text>
    <text x="452" y="274">plan the approach</text>
    <text x="416" y="316">edit files across the project</text>
    <text x="452" y="370">run tests via hooks</text>
    <text x="416" y="408">commit the changes</text>
    <text x="188" y="436">present diff and results</text>
  </g>
</svg>
