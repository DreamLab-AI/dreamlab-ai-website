<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">The AI coding agent ecosystem</title>
  <desc id="dg-desc">Terminal agents — Claude Code (Fable 5, Opus 4.8, Sonnet 4.6), Codex CLI (codex-mini, o4-mini, GPT-4o) and Aider — alongside IDE-integrated tools and chat/API options.</desc>

  <rect x="8" y="8" width="944" height="368" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">CHOOSE YOUR AGENT</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="400" height="232" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="248" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Terminal Agents</text>
    <text x="248" y="176" font-size="13" font-weight="600" fill="#F5F5F5">Claude Code</text>
    <text x="248" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">Fable 5 · Opus 4.8 · Sonnet 4.6</text>
    <text x="248" y="232" font-size="13" font-weight="600" fill="#F5F5F5">Codex CLI</text>
    <text x="248" y="252" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">codex-mini · o4-mini · GPT-4o</text>
    <text x="248" y="288" font-size="13" font-weight="600" fill="#F5F5F5">Aider</text>
    <text x="248" y="308" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">open source · bring a model</text>

    <rect x="496" y="104" width="416" height="104" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="704" y="144" font-size="15" font-weight="600" fill="#F5F5F5">IDE-Integrated</text>
    <text x="704" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Cursor · Copilot · Windsurf · Continue</text>

    <rect x="496" y="232" width="416" height="104" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="704" y="272" font-size="15" font-weight="600" fill="#F5F5F5">Chat &amp; API</text>
    <text x="704" y="304" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">ChatGPT · Claude.ai · SDKs &amp; APIs</text>
  </g>
