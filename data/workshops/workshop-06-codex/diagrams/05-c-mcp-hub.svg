<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">MCP connects an agent to external tools</title>
  <desc id="dg-desc">An AI coding agent speaks the MCP protocol, which fans out to database, GitHub, browser, Slack and custom servers — one protocol, many tools.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-net" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="376" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">MCP · MODEL CONTEXT PROTOCOL</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="184" width="192" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="216" font-size="15" font-weight="600" fill="#F5F5F5">AI Coding Agent</text>
    <text x="144" y="238" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Claude Code · Codex</text>

    <rect x="368" y="176" width="192" height="88" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="464" y="212" font-size="15" font-weight="600" fill="#F5F5F5">MCP Protocol</text>
    <text x="464" y="236" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">one protocol, many tools</text>

    <g font-size="13" font-weight="600" fill="#F5F5F5">
      <rect x="688" y="88" width="224" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
      <text x="800" y="113">Database Server</text>
      <rect x="688" y="144" width="224" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
      <text x="800" y="169">GitHub Server</text>
      <rect x="688" y="200" width="224" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
      <text x="800" y="225">Browser Server</text>
      <rect x="688" y="256" width="224" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
      <text x="800" y="281">Slack Server</text>
      <rect x="688" y="312" width="224" height="40" rx="8" fill="none" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
      <text x="800" y="337" fill="#9CA3AF">Your Custom Server</text>
    </g>
  </g>

  <path d="M240,220 C280,220 320,220 360,220" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
  <g fill="none" stroke="#38BDF8" stroke-width="1.2">
    <path d="M560,196 C616,160 640,124 680,112" marker-end="url(#arr-net)"/>
    <path d="M560,208 C608,192 640,172 680,166" marker-end="url(#arr-net)"/>
    <path d="M560,220 C608,220 640,220 680,220" marker-end="url(#arr-net)"/>
    <path d="M560,232 C608,248 640,268 680,274" marker-end="url(#arr-net)"/>
    <path d="M560,244 C616,280 640,316 680,328" stroke-dasharray="4 3" marker-end="url(#arr-net)"/>
  </g>
</svg>
