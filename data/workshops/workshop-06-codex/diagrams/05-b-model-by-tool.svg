<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Model choice by tool</title>
  <desc id="dg-desc">In Claude Code, pick Fable 5 or Opus 4.8 for complex work, Sonnet 4.6 via fast mode for routine tasks and Haiku 4.5 for bulk. In Codex CLI, o3 or GPT-4o for reasoning, codex-mini or o4-mini for interactive and cost-sensitive work. IDE tools choose the model for you.</desc>

  <rect x="8" y="8" width="944" height="336" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">MODEL CHOICE BY TOOL</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="272" height="200" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="184" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Claude Code</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">
      <text x="184" y="180">complex → Fable 5 / Opus</text>
      <text x="184" y="212">routine → Sonnet (/fast)</text>
      <text x="184" y="244">bulk → Haiku 4.5</text>
    </g>

    <rect x="344" y="104" width="272" height="200" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Codex CLI</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">
      <text x="480" y="180">reasoning → o3 / GPT-4o</text>
      <text x="480" y="212">interactive → codex-mini</text>
      <text x="480" y="244">cost-sensitive → o4-mini</text>
    </g>

    <rect x="640" y="104" width="272" height="200" rx="8" fill="none" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="776" y="140" font-size="15" font-weight="600" fill="#F5F5F5">IDE Tools</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">
      <text x="776" y="180">model selected</text>
      <text x="776" y="212">by the tool</text>
    </g>
  </g>
</svg>
