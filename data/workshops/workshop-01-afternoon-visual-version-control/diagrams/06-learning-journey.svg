    <text x="308" y="156" font-size="14" font-weight="600" fill="#F5F5F5">Daily Practice</text>
    <text x="308" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">7d · confident</text>

    <rect x="416" y="120" width="152" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="492" y="150" font-size="14" font-weight="600" fill="#F5F5F5">Template</text>
