<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="d3a-title d3a-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d3a-title">Client onboarding flow</title>
  <desc id="d3a-desc">Enquiries are reviewed; qualified clients get a discovery call and proposal, looping through revisions until acceptance completes onboarding. Unqualified enquiries receive a decline email.</desc>
  <defs>
    <marker id="arr3a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="464" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">CLIENT ONBOARDING FLOW</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="148" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="122" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Client Enquiry</text>
    <text x="122" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">form submitted</text>

    <rect x="236" y="104" width="132" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="302" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Review</text>
    <text x="302" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">within 24h</text>

    <rect x="424" y="108" width="56" height="56" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)" transform="rotate(45 452 136)"/>
    <text x="452" y="141" font-size="12" font-weight="600" fill="#F5F5F5">Fit?</text>

    <rect x="376" y="248" width="152" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="452" y="274" font-size="14" font-weight="600" fill="#F5F5F5">Decline Email</text>
    <text x="452" y="294" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">polite pass</text>

    <rect x="548" y="104" width="160" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="628" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Discovery Call</text>
    <text x="628" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">scheduled</text>

    <rect x="756" y="104" width="148" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="830" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Proposal</text>
    <text x="830" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">create · send</text>

    <rect x="802" y="252" width="56" height="56" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)" transform="rotate(45 830 280)"/>
    <text x="830" y="285" font-size="11" font-weight="600" fill="#F5F5F5">Accept?</text>

    <rect x="756" y="380" width="148" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="830" y="404" font-size="14" font-weight="600" fill="#F5F5F5">Revise</text>
    <text x="830" y="424" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">and resubmit</text>

    <rect x="524" y="252" width="208" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="628" y="280" font-size="15" font-weight="600" fill="#F5F5F5">Onboarding</text>
    <text x="628" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">lead assigned · welcome pack</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M196,136 L232,136" marker-end="url(#arr3a)"/>
    <path d="M368,136 L408,136" marker-end="url(#arr3a)"/>
    <path d="M452,180 L452,244" marker-end="url(#arr3a)"/>
    <path d="M496,136 L544,136" marker-end="url(#arr3a)"/>
    <path d="M708,136 L752,136" marker-end="url(#arr3a)"/>
    <path d="M830,168 L830,232" marker-end="url(#arr3a)"/>
    <path d="M830,328 L830,376" marker-end="url(#arr3a)"/>
    <path d="M908,408 C936,408 936,136 908,136" marker-end="url(#arr3a)"/>
    <path d="M786,280 L736,280" marker-end="url(#arr3a)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
    <text x="464" y="208">no</text>
    <text x="508" y="128">yes</text>
    <text x="842" y="204">send</text>
    <text x="842" y="356">changes</text>
    <text x="748" y="272">yes</text>
  </g>
</svg>
