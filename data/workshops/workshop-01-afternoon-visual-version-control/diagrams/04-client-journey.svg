<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" role="img" aria-labelledby="d4d-title d4d-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d4d-title">Client journey map</title>
  <desc id="d4d-desc">Leads are contacted and qualified; unqualified leads enter a nurture loop. Qualified leads move through discovery and proposal, looping on revisions, to contract signing then delivery, review and repeat business.</desc>
  <defs>
    <marker id="arr4d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="400" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">CLIENT JOURNEY — END TO END</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="140" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="118" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Lead</text>
    <text x="118" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">generation</text>

    <rect x="228" y="104" width="140" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="298" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Contact</text>
    <text x="298" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">initial reach-out</text>

    <rect x="416" y="108" width="56" height="56" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)" transform="rotate(45 444 136)"/>
    <text x="444" y="140" font-size="11" font-weight="600" fill="#F5F5F5">Fit?</text>

    <rect x="368" y="252" width="152" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="444" y="276" font-size="14" font-weight="600" fill="#F5F5F5">Nurture</text>
    <text x="444" y="296" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">campaign ⟲ contact</text>

    <rect x="536" y="104" width="152" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="612" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Discovery</text>
    <text x="612" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">meeting</text>

    <rect x="728" y="104" width="152" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="804" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Proposal</text>
    <text x="804" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">revise ⟲ accept</text>

    <rect x="700" y="252" width="180" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="790" y="280" font-size="15" font-weight="600" fill="#F5F5F5">Contract</text>
    <text x="790" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">signing · onboarding</text>

    <rect x="536" y="252" width="120" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="596" y="280" font-size="14" font-weight="600" fill="#F5F5F5">Delivery</text>
    <text x="596" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">project work</text>

    <rect x="228" y="252" width="120" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="288" y="280" font-size="14" font-weight="600" fill="#F5F5F5">Review</text>
    <text x="288" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">repeat? ⟲ discovery</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M188,136 L224,136" marker-end="url(#arr4d)"/>
    <path d="M368,136 L400,136" marker-end="url(#arr4d)"/>
    <path d="M444,180 L444,248" marker-end="url(#arr4d)"/>
    <path d="M364,280 C328,280 300,220 298,172" marker-end="url(#arr4d)"/>
    <path d="M488,136 L532,136" marker-end="url(#arr4d)"/>
    <path d="M688,136 L724,136" marker-end="url(#arr4d)"/>
    <path d="M804,168 L796,248" marker-end="url(#arr4d)"/>
    <path d="M696,284 L660,284" marker-end="url(#arr4d)"/>
    <path d="M532,284 L352,284" marker-end="url(#arr4d)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
    <text x="456" y="212">no</text>
    <text x="496" y="128">yes</text>
    <text x="812" y="212">accepted</text>
  </g>
</svg>
