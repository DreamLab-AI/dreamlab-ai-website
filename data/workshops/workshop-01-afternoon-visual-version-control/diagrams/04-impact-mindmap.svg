<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="d4g-title d4g-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d4g-title">Project impact summary</title>
  <desc id="d4g-desc">Three impact groups: metrics such as engagement, sharing and conversion gains; qualitative outcomes including client feedback and recognition; and lessons learned about briefs, reviews and asset management.</desc>
  <rect x="8" y="8" width="944" height="296" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">PROJECT IMPACT</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g>
    <rect x="48" y="96" width="272" height="176" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="72" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" letter-spacing="0.14em" fill="#F59E0B">METRICS</text>
    <text x="72" y="164" font-size="14" font-weight="600" fill="#F5F5F5">40% engagement increase</text>
    <text x="72" y="196" font-size="14" font-weight="600" fill="#F5F5F5">2× social sharing</text>
    <text x="72" y="228" font-size="14" font-weight="600" fill="#F5F5F5">15% conversion uplift</text>

    <rect x="344" y="96" width="272" height="176" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" letter-spacing="0.14em" fill="#9CA3AF">QUALITATIVE</text>
    <text x="368" y="164" font-size="14" font-weight="600" fill="#F5F5F5">Positive client feedback</text>
    <text x="368" y="196" font-size="14" font-weight="600" fill="#F5F5F5">Industry recognition</text>
    <text x="368" y="228" font-size="14" font-weight="600" fill="#F5F5F5">Team skill growth</text>

    <rect x="640" y="96" width="272" height="176" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="664" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" letter-spacing="0.14em" fill="#9CA3AF">LESSONS LEARNED</text>
    <text x="664" y="164" font-size="14" font-weight="600" fill="#F5F5F5">Tighter brief needed</text>
    <text x="664" y="196" font-size="14" font-weight="600" fill="#F5F5F5">Earlier stakeholder review</text>
    <text x="664" y="228" font-size="14" font-weight="600" fill="#F5F5F5">Better asset management</text>
  </g>
</svg>
