<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="d5a-title d5a-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="d5a-title">Online order fulfilment flow</title>
  <desc id="d5a-desc">An order is placed and stock checked. In-stock orders are confirmed, packed at the warehouse, dispatched with a tracking notification and completed. Out-of-stock orders trigger a customer notification with alternatives.</desc>
  <defs>
    <marker id="arr5a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="384" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">ORDER FULFILMENT FLOW</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="152" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="124" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Order Placed</text>
    <text x="124" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">online checkout</text>

    <rect x="240" y="104" width="152" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="316" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Check Stock</text>
    <text x="316" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">system lookup</text>

    <rect x="440" y="108" width="56" height="56" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)" transform="rotate(45 468 136)"/>
    <text x="468" y="140" font-size="10" font-weight="600" fill="#F5F5F5">Stock?</text>

    <rect x="356" y="252" width="224" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="468" y="278" font-size="14" font-weight="600" fill="#F5F5F5">Notify Customer</text>
    <text x="468" y="298" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">offer alternatives</text>

    <rect x="560" y="104" width="168" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="644" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Confirm &amp; Pack</text>
    <text x="644" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">sent to warehouse</text>

    <rect x="760" y="104" width="152" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="836" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Dispatch</text>
    <text x="836" y="152" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">tracking sent</text>

    <rect x="656" y="252" width="224" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="768" y="280" font-size="15" font-weight="600" fill="#F5F5F5">Order Complete</text>
    <text x="768" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">customer notified</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M200,136 L236,136" marker-end="url(#arr5a)"/>
    <path d="M392,136 L424,136" marker-end="url(#arr5a)"/>
    <path d="M468,180 L468,248" marker-end="url(#arr5a)"/>
    <path d="M512,136 L556,136" marker-end="url(#arr5a)"/>
    <path d="M728,136 L756,136" marker-end="url(#arr5a)"/>
    <path d="M836,168 L800,248" marker-end="url(#arr5a)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
    <text x="480" y="212">no</text>
    <text x="520" y="128">yes</text>
  </g>
</svg>
