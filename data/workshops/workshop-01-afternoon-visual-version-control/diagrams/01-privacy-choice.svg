<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="01-privacy-choice-t 01-privacy-choice-d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="01-privacy-choice-t">Choosing repository visibility</title>
  <desc id="01-privacy-choice-d">Every repository gets a visibility choice: private (only you), team (selected people) or public (a portfolio piece).</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="352" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">SECURITY · WHO SEES YOUR WORK</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
    <rect x="48" y="148" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="193" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">Your work</text>
    <rect x="332" y="120" width="136" height="136" rx="4" transform="rotate(45 400 188)" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="400" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">Visibility?</text>
    <rect x="576" y="96" width="208" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="680" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Private</text>
    <text x="680" y="144" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">only you · full control</text>
    <rect x="576" y="176" width="208" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="680" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Team</text>
    <text x="680" y="224" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">selected people</text>
    <rect x="576" y="256" width="208" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="680" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Public</text>
    <text x="680" y="304" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">portfolio piece</text>
    <path d="M240,188 L326,188" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M448,164 C500,140 528,132 570,128" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M468,188 L570,208" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M448,212 C500,236 528,248 570,284" fill="none" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arr-accent)"/>

</svg>
