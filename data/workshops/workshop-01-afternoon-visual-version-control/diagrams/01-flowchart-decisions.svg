<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" role="img" aria-labelledby="01-flowchart-decisions-t 01-flowchart-decisions-d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="01-flowchart-decisions-t">Flowchart with decision points</title>
  <desc id="01-flowchart-decisions-d">Gather requirements, check they are clear (loop back to clarify if not), design, seek approval (loop back to rework if refused), then deploy.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="328" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">FLOWCHART · PROCESS DOCUMENTATION</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
    <rect x="48" y="152" width="176" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="136" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Gather</text>
    <text x="136" y="204" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">requirements</text>
    <rect x="268" y="132" width="112" height="112" rx="4" transform="rotate(45 324 188)" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="324" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">Clear?</text>
    <rect x="444" y="152" width="160" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="524" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Design</text>
    <rect x="628" y="124" width="128" height="128" rx="4" transform="rotate(45 692 188)" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="692" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">Approved?</text>
    <rect x="800" y="152" width="128" height="72" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="864" y="193" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Deploy</text>
    <path d="M224,188 L262,188" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M386,188 L438,188" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="412" y="176" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">yes</text>
    <path d="M604,188 L622,188" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M762,188 L794,188" fill="none" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arr-accent)"/>
    <text x="778" y="176" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">yes</text>
    <path d="M324,244 C324,296 200,296 148,230" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="252" y="290" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">no · clarify</text>
    <path d="M692,258 C692,304 560,304 512,230" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="620" y="298" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">no · rework</text>

</svg>
