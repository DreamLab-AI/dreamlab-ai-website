<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="01-github-platform-t 01-github-platform-d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="01-github-platform-t">What the GitHub platform provides</title>
  <desc id="01-github-platform-d">GitHub is more than storage: cloud backup, a public portfolio, collaboration through issues, boards and reviews, and free hosting via GitHub Pages.</desc>
