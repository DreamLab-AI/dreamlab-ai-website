<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="01-git-workflow-t 01-git-workflow-d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="01-git-workflow-t">The version control workflow</title>
  <desc id="01-git-workflow-d">Work on files, stage the changes you want, commit a snapshot with a message, then push to GitHub for backup, portfolio and team access.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="224" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">VERSION CONTROL WORKFLOW</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
    <rect x="48" y="112" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">Work on files</text>
    <text x="144" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">edit anything</text>
    <rect x="288" y="112" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="384" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">Stage changes</text>
    <text x="384" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">choose what to save</text>
    <rect x="528" y="112" width="192" height="80" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="624" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">Commit</text>
    <text x="624" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">snapshot + message</text>
    <rect x="768" y="112" width="160" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="848" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">GitHub</text>
    <text x="848" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">backup · portfolio · team</text>
    <path d="M240,152 L282,152" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M480,152 L522,152" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
    <path d="M720,152 L762,152" fill="none" stroke="#F59E0B" stroke-width="1.2" marker-end="url(#arr-accent)"/>
    <text x="742" y="140" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">push</text>

</svg>
