<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="cp-title cp-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="cp-title">Building through conversation</title>
  <desc id="cp-desc">What you say in plain language, what the AI creates in code, and the control you keep over the result.</desc>
  <rect x="8" y="8" width="944" height="344" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">BUILDING THROUGH CONVERSATION</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
  <g text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
    <rect x="48" y="104" width="272" height="216" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="184" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">What You Say</text>
    <text x="184" y="176" fill="#9CA3AF">"make it blue"</text>
    <text x="184" y="204" fill="#9CA3AF">"add a contact form"</text>
    <text x="184" y="232" fill="#9CA3AF">"include animations"</text>
    <text x="184" y="260" fill="#9CA3AF">"make it mobile-friendly"</text>

    <rect x="344" y="104" width="272" height="216" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">What AI Creates</text>
    <text x="480" y="176" fill="#9CA3AF">complete HTML</text>
    <text x="480" y="204" fill="#9CA3AF">styled CSS</text>
    <text x="480" y="232" fill="#9CA3AF">interactive JavaScript</text>
    <text x="480" y="260" fill="#9CA3AF">responsive design</text>

    <rect x="640" y="104" width="272" height="216" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="776" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">Your Control</text>
    <text x="776" y="176" fill="#F59E0B">instant preview</text>
    <text x="776" y="204" fill="#F59E0B">easy refinements</text>
    <text x="776" y="232" fill="#F59E0B">no coding required</text>
    <text x="776" y="260" fill="#F59E0B">professional results</text>
  </g>
</svg>
