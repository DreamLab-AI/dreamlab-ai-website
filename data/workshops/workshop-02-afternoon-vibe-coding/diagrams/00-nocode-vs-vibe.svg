<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="nv-title nv-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="nv-title">Drag-and-drop builders versus vibe coding</title>
  <desc id="nv-desc">Traditional no-code tools move from template to compromise; vibe coding moves from described vision to achieved vision.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="344" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THE CREATIVE FREEDOM GAP</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <text x="48" y="112" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">TRADITIONAL NO-CODE</text>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <rect x="48" y="124" width="192" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="158" fill="#F5F5F5">Choose template</text>
    <rect x="272" y="124" width="192" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="158" fill="#F5F5F5">Modify slightly</text>
    <rect x="496" y="124" width="192" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="158" fill="#F5F5F5">Hit limitations</text>
    <rect x="720" y="124" width="192" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="816" y="158" fill="#9CA3AF">Compromise vision</text>
  </g>

  <text x="48" y="240" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">VIBE CODING</text>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <rect x="48" y="252" width="192" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="286" fill="#F5F5F5">Describe vision</text>
    <rect x="272" y="252" width="192" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="286" fill="#F5F5F5">See it created</text>
    <rect x="496" y="252" width="192" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="286" fill="#F5F5F5">Refine perfectly</text>
    <rect x="720" y="252" width="192" height="56" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="816" y="286" fill="#F5F5F5">Achieve vision</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M240,152 L268,152" marker-end="url(#arr)"/>
    <path d="M464,152 L492,152" marker-end="url(#arr)"/>
    <path d="M688,152 L716,152" marker-end="url(#arr)"/>
    <path d="M240,280 L268,280" marker-end="url(#arr)"/>
    <path d="M464,280 L492,280" marker-end="url(#arr)"/>
    <path d="M688,280 L716,280" marker-end="url(#arr)"/>
  </g>
</svg>
