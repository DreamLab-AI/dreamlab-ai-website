<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="tb-title tb-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="tb-title">The communication bridge</title>
  <desc id="tb-desc">Your natural language, visuals and analogies pass through the AI translation layer — intent recognition, pattern matching, code synthesis — to become HTML, CSS and JavaScript.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="304" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THE COMMUNICATION BRIDGE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
    <rect x="48" y="104" width="256" height="168" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="176" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">Your World</text>
    <text x="176" y="176" fill="#9CA3AF">natural language</text>
    <text x="176" y="204" fill="#9CA3AF">visual descriptions</text>
    <text x="176" y="232" fill="#9CA3AF">analogies &amp; examples</text>

    <rect x="352" y="104" width="256" height="168" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">AI Translation Layer</text>
    <text x="480" y="176" fill="#F59E0B">intent recognition</text>
    <text x="480" y="204" fill="#F59E0B">pattern matching</text>
    <text x="480" y="232" fill="#F59E0B">code synthesis</text>

    <rect x="656" y="104" width="256" height="168" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="784" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">Computer World</text>
    <text x="784" y="176" fill="#9CA3AF">HTML structure</text>
    <text x="784" y="204" fill="#9CA3AF">CSS styling</text>
    <text x="784" y="232" fill="#9CA3AF">JavaScript behaviour</text>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M304,188 L344,188" marker-end="url(#arr)"/>
    <path d="M608,188 L648,188" marker-end="url(#arr)"/>
  </g>
</svg>
