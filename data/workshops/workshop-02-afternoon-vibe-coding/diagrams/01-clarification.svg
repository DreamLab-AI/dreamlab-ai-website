<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="cl-title cl-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="cl-title">The clarification technique</title>
  <desc id="cl-desc">When a result is unexpected, clarify your intent with a specific example, describe the desired outcome, and the AI adjusts.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="244" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THE CLARIFICATION TECHNIQUE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
  <g text-anchor="middle">
    <rect x="48" y="112" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="148" font-size="15" font-weight="600" fill="#F5F5F5">Unexpected Result</text>
    <text x="144" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">AI misunderstood</text>

    <rect x="272" y="112" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="148" font-size="15" font-weight="600" fill="#F5F5F5">Clarify Intent</text>
    <text x="368" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">give a specific example</text>

    <rect x="496" y="112" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="148" font-size="15" font-weight="600" fill="#F5F5F5">Describe Outcome</text>
    <text x="592" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">show what's wrong</text>

    <rect x="720" y="112" width="192" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="816" y="148" font-size="15" font-weight="600" fill="#F5F5F5">AI Adjusts</text>
    <text x="816" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">back on track</text>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M240,152 L268,152" marker-end="url(#arr)"/>
    <path d="M464,152 L492,152" marker-end="url(#arr)"/>
    <path d="M688,152 L716,152" marker-end="url(#arr)"/>
  </g>
</svg>
