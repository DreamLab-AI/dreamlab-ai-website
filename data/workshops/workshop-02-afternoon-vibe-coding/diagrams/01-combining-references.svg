<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="cr-title cr-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="cr-title">Combining inspirations</title>
  <desc id="cr-desc">Three references — Airbnb's layout, Medium's typography and Apple's minimalism — are synthesised by AI into your unique creation.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="324" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">COMBINING INSPIRATIONS</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="256" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="176" y="132" font-size="14" font-weight="600" fill="#F5F5F5">Airbnb's layout</text>
    <text x="176" y="150" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">reference 1</text>

    <rect x="48" y="184" width="256" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="176" y="212" font-size="14" font-weight="600" fill="#F5F5F5">Medium's typography</text>
    <text x="176" y="230" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">reference 2</text>

    <rect x="48" y="264" width="256" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="176" y="292" font-size="14" font-weight="600" fill="#F5F5F5">Apple's minimalism</text>
    <text x="176" y="310" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">reference 3</text>

    <rect x="416" y="176" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="512" y="212" font-size="15" font-weight="600" fill="#F5F5F5">AI Synthesis</text>
    <text x="512" y="236" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">blends the ideas</text>

    <rect x="680" y="176" width="232" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="796" y="212" font-size="15" font-weight="600" fill="#F5F5F5">Your Unique Creation</text>
    <text x="796" y="236" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">not a template</text>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M304,132 C360,132 384,180 408,196" marker-end="url(#arr)"/>
    <path d="M304,212 L408,214" marker-end="url(#arr)"/>
    <path d="M304,292 C360,292 384,252 408,236" marker-end="url(#arr)"/>
    <path d="M608,216 L672,216" marker-end="url(#arr)"/>
  </g>
</svg>
