<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="dm-title dm-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dm-title">The director mindset</title>
  <desc id="dm-desc">Think like a director, not a developer: hold the vision, give direction in plain language, and offer feedback as the work evolves.</desc>
  <rect x="8" y="8" width="944" height="324" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THINK LIKE A DIRECTOR, NOT A DEVELOPER</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
  <g text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
    <rect x="48" y="104" width="272" height="200" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="184" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">Vision</text>
    <text x="184" y="176" fill="#F59E0B">overall feeling</text>
    <text x="184" y="204" fill="#F59E0B">user journey</text>
    <text x="184" y="232" fill="#F59E0B">emotional impact</text>
    <text x="184" y="260" fill="#F59E0B">brand alignment</text>

    <rect x="344" y="104" width="272" height="200" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">Direction</text>
    <text x="480" y="176" fill="#9CA3AF">"make it more energetic"</text>
    <text x="480" y="204" fill="#9CA3AF">"tone down the colours"</text>
    <text x="480" y="232" fill="#9CA3AF">"speed up transitions"</text>
    <text x="480" y="260" fill="#9CA3AF">"add breathing room"</text>

    <rect x="640" y="104" width="272" height="200" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="776" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#F5F5F5">Feedback</text>
    <text x="776" y="176" fill="#9CA3AF">"this works great"</text>
    <text x="776" y="204" fill="#9CA3AF">"let's try something else"</text>
    <text x="776" y="232" fill="#9CA3AF">"almost there"</text>
    <text x="776" y="260" fill="#9CA3AF">"perfect!"</text>
  </g>
</svg>
