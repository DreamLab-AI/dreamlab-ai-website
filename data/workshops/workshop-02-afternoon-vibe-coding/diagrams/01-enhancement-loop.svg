<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="el-title el-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="el-title">The enhancement loop</title>
  <desc id="el-desc">Add a feature, test and review, then decide: if unhappy, describe changes and loop back; if happy, move to the next feature and repeat.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="344" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THE ENHANCEMENT LOOP</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="140" width="192" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="172" font-size="15" font-weight="600" fill="#F5F5F5">Add Feature</text>
    <text x="144" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">start simple</text>

    <rect x="304" y="140" width="192" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="400" y="172" font-size="15" font-weight="600" fill="#F5F5F5">Test &amp; Review</text>
    <text x="400" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">look at the result</text>

    <path d="M612,120 L668,176 L612,232 L556,176 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="612" y="182" font-size="14" font-weight="600" fill="#F5F5F5">Happy?</text>

    <rect x="720" y="140" width="192" height="72" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="816" y="172" font-size="15" font-weight="600" fill="#F5F5F5">Next Feature</text>
    <text x="816" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">keep building</text>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M240,176 L296,176" marker-end="url(#arr)"/>
    <path d="M496,176 L548,176" marker-end="url(#arr)"/>
    <path d="M668,176 L712,176" marker-end="url(#arr)"/>
    <path d="M612,232 C612,288 200,288 148,216" marker-end="url(#arr)"/>
    <path d="M816,212 C816,308 448,308 400,216" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">
    <text x="668" y="168">yes</text>
    <text x="380" y="272" text-anchor="middle">no — describe changes</text>
    <text x="612" y="316" text-anchor="middle">loop again with the next idea</text>
  </g>
</svg>
