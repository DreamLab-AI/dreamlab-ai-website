<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="lj-title lj-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="lj-title">Session learning journey</title>
  <desc id="lj-desc">Timeline of the session: concepts, first website, advanced features, exercises, project, then showcase of results.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="284" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">SESSION LEARNING JOURNEY</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <path d="M64,180 L900,180" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
  <g text-anchor="middle">
    <circle cx="96" cy="180" r="4" fill="#9CA3AF"/>
    <text x="96" y="148" font-size="14" font-weight="600" fill="#F5F5F5">Concepts</text>
    <text x="96" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">30 min</text>

    <circle cx="248" cy="180" r="4" fill="#9CA3AF"/>
    <text x="248" y="148" font-size="14" font-weight="600" fill="#F5F5F5">First Website</text>
    <text x="248" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">45 min</text>

    <circle cx="400" cy="180" r="4" fill="#9CA3AF"/>
    <text x="400" y="148" font-size="14" font-weight="600" fill="#F5F5F5">Advanced</text>
    <text x="400" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">45 min</text>

    <circle cx="552" cy="180" r="4" fill="#9CA3AF"/>
    <text x="552" y="148" font-size="14" font-weight="600" fill="#F5F5F5">Exercises</text>
    <text x="552" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">30 min</text>

    <circle cx="704" cy="180" r="4" fill="#9CA3AF"/>
    <text x="704" y="148" font-size="14" font-weight="600" fill="#F5F5F5">Project</text>
    <text x="704" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">20 min</text>

    <circle cx="856" cy="180" r="5" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="856" y="148" font-size="14" font-weight="600" fill="#F5F5F5">Showcase</text>
    <text x="856" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">10 min</text>
  </g>
  <text x="480" y="256" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">how it works → build &amp; deploy → interactions &amp; data → practice → your creation → results</text>
</svg>
