<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" role="img" aria-labelledby="tm dm" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="tm">Choosing a model by task</title>
  <desc id="dm">Simple tasks that need speed go to mini and Haiku models; balanced everyday work suits GPT-4o, Sonnet or Gemini 2.5 Pro; complex reasoning belongs to o3, Opus and Fable 5.</desc>
  <defs>
    <marker id="arrm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrsm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="360" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">WHICH MODEL FOR WHICH TASK?</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
  <rect x="384" y="96" width="192" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="480" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">What's the task?</text>
  <rect x="96" y="232" width="192" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="192" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Simple + fast</text>
  <text x="192" y="285" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">GPT-4o-mini · Haiku · Flash</text>
  <rect x="384" y="232" width="192" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="480" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Everyday / budget</text>
  <text x="480" y="285" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">GPT-4o · Sonnet · Gemini Pro</text>
  <rect x="672" y="232" width="192" height="72" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="768" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Complex reasoning</text>
  <text x="768" y="285" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">o3 · Opus · Fable 5</text>
  <path d="M432,144 C336,176 256,196 208,228" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arrm)"/>
  <text x="280" y="184" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">simple</text>
  <path d="M480,144 C480,176 480,196 480,228" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arrm)"/>
  <text x="512" y="192" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">medium</text>
  <path d="M528,144 C624,176 704,196 752,228" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arrm)"/>
  <text x="688" y="184" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">complex</text>
  <text x="480" y="344" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#6B7280">rule of thumb: start cheap, escalate only when quality falls short</text>
</svg>
