<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="tj dj" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="tj">Four levers for optimising API cost</title>
  <desc id="dj">Choose the right model for the task, manage context tightly, cache repeated responses, and batch work together.</desc>
  <defs>
    <marker id="arrj" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrsj" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="304" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">COST OPTIMISATION LEVERS</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
  <rect x="48" y="112" width="424" height="76" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="260" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">Choose the right model</text>
  <text x="260" y="167" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">cheap for simple · big for hard</text>
  <rect x="488" y="112" width="424" height="76" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="700" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">Manage context</text>
  <text x="700" y="167" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">trim history · concise prompts</text>
  <rect x="48" y="204" width="424" height="76" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="260" y="237" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">Cache responses</text>
  <text x="260" y="259" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">store repeats · prompt caching</text>
  <rect x="488" y="204" width="424" height="76" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="700" y="237" text-anchor="middle" font-size="15" font-weight="600" fill="#F5F5F5">Batch processing</text>
  <text x="700" y="259" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">combine prompts · batch files</text>
</svg>
