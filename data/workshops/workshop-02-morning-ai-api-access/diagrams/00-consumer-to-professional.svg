<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" role="img" aria-labelledby="ta da" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ta">From consumer AI to professional control</title>
  <desc id="da">Four consumer-AI limitations each map to a professional API capability: fixed interfaces become customisation, subscriptions become pay-per-use, limited models become full access, and copy-paste becomes direct automated integration.</desc>
  <defs>
    <marker id="arra" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrsa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="368" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">CONSUMER AI → PROFESSIONAL CONTROL</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
  <text x="220" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#6B7280">CONSUMER EXPERIENCE</text>
  <text x="740" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#F59E0B">PROFESSIONAL CONTROL</text>
  <rect x="48" y="128" width="344" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="220" y="157" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Fixed interfaces</text>
  <rect x="568" y="128" width="344" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="740" y="157" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Complete customisation</text>
  <path d="M392,152 C456,152 504,152 564,152" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arra)"/>
  <rect x="48" y="188" width="344" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="220" y="217" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Subscription costs</text>
  <rect x="568" y="188" width="344" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="740" y="217" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Pay only for what you use</text>
  <path d="M392,212 C456,212 504,212 564,212" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arra)"/>
  <rect x="48" y="248" width="344" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="220" y="277" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Limited model choice</text>
  <rect x="568" y="248" width="344" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="740" y="277" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Access every model</text>
  <path d="M392,272 C456,272 504,272 564,272" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arra)"/>
  <rect x="48" y="308" width="344" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="220" y="337" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Copy-paste workflow</text>
  <rect x="568" y="308" width="344" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="740" y="337" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Direct integration &amp; automation</text>
  <path d="M392,332 C456,332 504,332 564,332" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arra)"/>
</svg>
