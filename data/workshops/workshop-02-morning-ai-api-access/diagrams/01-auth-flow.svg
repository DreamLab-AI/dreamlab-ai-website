<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" role="img" aria-labelledby="th dh" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="th">API key authentication</title>
  <desc id="dh">Each request is checked: a valid API key is processed, usage is logged to billing, and a response returns; an invalid key gets 401 Unauthorized.</desc>
  <defs>
    <marker id="arrh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrsh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="944" height="280" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">EVERY REQUEST IS AUTHENTICATED</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>
  <rect x="48" y="148" width="176" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="136" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Your request</text>
  <text x="136" y="193" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">with API key</text>
  <rect x="296" y="132" width="88" height="88" rx="4" transform="rotate(45 340 176)" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="340" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">key</text>
  <text x="340" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#F5F5F5">valid?</text>
  <path d="M224,176 C248,176 256,176 272,176" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arrh)"/>
  <path d="M404,176 C440,176 456,152 484,132" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arrh)"/>
  <text x="448" y="152" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">yes</text>
  <path d="M404,176 C440,176 456,200 484,220" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arrh)"/>
  <text x="448" y="216" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">no</text>
  <rect x="488" y="96" width="208" height="56" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="592" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Process request</text>
  <rect x="488" y="200" width="208" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="592" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">401 Unauthorized</text>
  <text x="592" y="245" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">fix or rotate the key</text>
  <path d="M696,124 C736,124 744,124 764,124" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arrh)"/>
  <rect x="768" y="96" width="144" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
  <text x="840" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#F5F5F5">Response</text>
  <text x="840" y="180" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">usage logged → billing</text>
</svg>
