<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="es-title es-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="es-title">Embedding space and semantic similarity</title>
  <desc id="es-desc">Texts become points in a vector space. A query about working from home lands close to remote-working policy chunks and far from expense-policy chunks; retrieval returns the nearest points.</desc>

  <!-- container -->
  <rect x="8" y="8" width="944" height="384" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">EMBEDDING SPACE — MEANING AS DISTANCE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- query point (focal) -->
  <g>
    <circle cx="272" cy="168" r="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="272" y="140" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">query: &#8220;can I work from home?&#8221;</text>
  </g>

  <!-- nearest-neighbour links -->
  <g fill="none" stroke="rgba(245,158,11,0.55)" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="280" y1="172" x2="396" y2="204"/>
    <line x1="278" y1="176" x2="372" y2="264"/>
  </g>

  <!-- relevant cluster -->
  <g fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)">
    <circle cx="404" cy="208" r="6"/>
    <circle cx="452" cy="248" r="6"/>
    <circle cx="376" cy="268" r="6"/>
  </g>
  <text x="420" y="304" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">remote working policy chunks</text>

  <!-- unrelated cluster -->
  <g fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.28)">
    <circle cx="756" cy="168" r="6"/>
    <circle cx="804" cy="208" r="6"/>
    <circle cx="764" cy="240" r="6"/>
  </g>
  <text x="780" y="276" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280">expense policy chunks</text>

  <!-- caption -->
  <text x="480" y="356" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">closer points = higher cosine similarity &#8212; retrieval returns the nearest chunks</text>
</svg>
