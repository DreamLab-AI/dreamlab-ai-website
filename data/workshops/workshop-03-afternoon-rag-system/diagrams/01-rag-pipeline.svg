<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="rp-title rp-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="rp-title">Modern RAG pipeline: indexing and query paths</title>
  <desc id="rp-desc">Offline indexing path: documents are chunked, embedded and stored in a vector store. Online query path: the query drives hybrid retrieval against the store, candidates are re-ranked, and the LLM generates a grounded answer.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="464" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">RAG PIPELINE — 2026 SHAPE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- indexing lane -->
  <text x="48" y="104" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#6B7280">INDEXING PATH — OFFLINE</text>
  <g text-anchor="middle">
    <rect x="48" y="116" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="152" font-size="15" font-weight="600" fill="#F5F5F5">Documents</text>
    <text x="144" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">pdf · md · txt</text>

    <rect x="272" y="116" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="152" font-size="15" font-weight="600" fill="#F5F5F5">Chunk</text>
    <text x="368" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">split + 10-20% overlap</text>

    <rect x="496" y="116" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="152" font-size="15" font-weight="600" fill="#F5F5F5">Embed</text>
    <text x="592" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">text &#8594; vectors</text>

    <rect x="720" y="116" width="192" height="80" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="816" y="152" font-size="15" font-weight="600" fill="#F5F5F5">Vector Store</text>
    <text x="816" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">vectors + metadata</text>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M240,156 C252,156 256,156 268,156" marker-end="url(#arr)"/>
    <path d="M464,156 C476,156 480,156 492,156" marker-end="url(#arr)"/>
    <path d="M688,156 C700,156 704,156 716,156" marker-end="url(#arr)"/>
  </g>

  <!-- store to retrieval -->
  <path d="M816,196 C816,264 440,252 392,312" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="616" y="252" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">top-k candidates</text>

  <!-- query lane -->
  <text x="48" y="304" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#6B7280">QUERY PATH — ONLINE</text>
  <g text-anchor="middle">
    <rect x="48" y="316" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="352" font-size="15" font-weight="600" fill="#F5F5F5">User Query</text>
    <text x="144" y="376" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">embedded like a chunk</text>

    <rect x="272" y="316" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="352" font-size="15" font-weight="600" fill="#F5F5F5">Hybrid Retrieve</text>
    <text x="368" y="376" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">vector + keyword</text>

    <rect x="496" y="316" width="192" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="592" y="352" font-size="15" font-weight="600" fill="#F5F5F5">Re-rank</text>
    <text x="592" y="376" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">precision over recall</text>

    <rect x="720" y="316" width="192" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="816" y="352" font-size="15" font-weight="600" fill="#F5F5F5">Generate</text>
    <text x="816" y="376" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">augmented prompt &#8594; answer</text>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M240,356 C252,356 256,356 268,356" marker-end="url(#arr)"/>
    <path d="M464,356 C476,356 480,356 492,356" marker-end="url(#arr)"/>
    <path d="M688,356 C700,356 704,356 716,356" marker-end="url(#arr)"/>
  </g>
</svg>
