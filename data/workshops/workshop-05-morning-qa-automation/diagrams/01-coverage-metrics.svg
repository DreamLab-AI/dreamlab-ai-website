<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Code coverage metrics</title>
  <desc id="dg-desc">Four ways to measure coverage: line coverage, branch coverage of if/else paths, function coverage, and statement coverage.</desc>

  <rect x="8" y="8" width="944" height="272" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">CODE COVERAGE METRICS</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="120" width="192" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="160" font-size="15" font-weight="600" fill="#F5F5F5">Line</text>
    <text x="144" y="184" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">% of lines executed</text>

    <rect x="272" y="120" width="192" height="96" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="368" y="160" font-size="15" font-weight="600" fill="#F5F5F5">Branch</text>
    <text x="368" y="184" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">% of if/else paths</text>

    <rect x="496" y="120" width="192" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="160" font-size="15" font-weight="600" fill="#F5F5F5">Function</text>
    <text x="592" y="184" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">% of functions called</text>

    <rect x="720" y="120" width="192" height="96" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="816" y="160" font-size="15" font-weight="600" fill="#F5F5F5">Statement</text>
    <text x="816" y="184" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">% of statements run</text>
  </g>
</svg>
