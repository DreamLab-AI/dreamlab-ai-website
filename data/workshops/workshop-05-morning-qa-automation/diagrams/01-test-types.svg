<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Types of automated tests</title>
  <desc id="dg-desc">Unit tests are fast, isolated and high-volume; integration tests exercise multiple components at medium speed; end-to-end tests are slow, full-system and low-volume. Visual, performance and security tests complete the mix.</desc>

  <rect x="8" y="8" width="944" height="384" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">TYPES OF TESTS</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="272" height="136" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="184" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Unit Tests</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">
      <text x="184" y="172">fast · isolated</text>
      <text x="184" y="196">high volume</text>
    </g>

    <rect x="344" y="104" width="272" height="136" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Integration Tests</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">
      <text x="480" y="172">medium speed · several parts</text>
      <text x="480" y="196">moderate volume</text>
    </g>

    <rect x="640" y="104" width="272" height="136" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="776" y="140" font-size="15" font-weight="600" fill="#F5F5F5">E2E Tests</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">
      <text x="776" y="172">slow · full system</text>
      <text x="776" y="196">low volume</text>
    </g>
  </g>

  <text x="48" y="296" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" letter-spacing="0.14em" fill="#6B7280">ALSO IN THE MIX</text>
  <g text-anchor="middle">
    <rect x="48" y="312" width="272" height="48" rx="8" fill="none" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="184" y="341" font-size="13" font-weight="600" fill="#9CA3AF">Visual Tests</text>
    <rect x="344" y="312" width="272" height="48" rx="8" fill="none" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="480" y="341" font-size="13" font-weight="600" fill="#9CA3AF">Performance Tests</text>
    <rect x="640" y="312" width="272" height="48" rx="8" fill="none" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="776" y="341" font-size="13" font-weight="600" fill="#9CA3AF">Security Tests</text>
  </g>
</svg>
