<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Fan-out, fan-in pattern</title>
  <desc id="dg-desc">A research query fans out to parallel academic, news and technical searches, whose results fan in to a synthesis step that produces the final report.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="488" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">FAN-OUT · FAN-IN</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- query -->
  <g text-anchor="middle">
    <rect x="384" y="96" width="192" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="130" font-size="14" font-weight="600" fill="#F5F5F5">Research Query</text>
  </g>

  <!-- fan-out arrows -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M424,152 C360,172 288,180 248,196" marker-end="url(#arr)"/>
    <path d="M480,152 L480,196" marker-end="url(#arr)"/>
    <path d="M536,152 C600,172 672,180 712,196" marker-end="url(#arr)"/>
  </g>
  <text x="600" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">fan-out · parallel</text>

  <!-- searches -->
  <g text-anchor="middle">
    <rect x="144" y="200" width="192" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="240" y="228" font-size="13" font-weight="600" fill="#F5F5F5">Academic Search</text>
    <text x="240" y="248" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">papers</text>

    <rect x="384" y="200" width="192" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="228" font-size="13" font-weight="600" fill="#F5F5F5">News Search</text>
    <text x="480" y="248" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">coverage</text>

    <rect x="624" y="200" width="192" height="64" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="720" y="228" font-size="13" font-weight="600" fill="#F5F5F5">Technical Search</text>
    <text x="720" y="248" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF">docs · code</text>
  </g>

  <!-- fan-in arrows -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M240,264 C288,288 376,292 416,308" marker-end="url(#arr)"/>
    <path d="M480,264 L480,308" marker-end="url(#arr)"/>
    <path d="M720,264 C672,288 584,292 544,308" marker-end="url(#arr)"/>
  </g>

  <!-- synthesis (focal) -->
  <g text-anchor="middle">
    <rect x="352" y="312" width="256" height="72" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="344" font-size="15" font-weight="600" fill="#F5F5F5">Synthesise</text>
    <text x="480" y="366" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">fan-in · merge findings</text>
  </g>

  <path d="M480,384 L480,420" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- report -->
  <g text-anchor="middle">
    <rect x="384" y="424" width="192" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="480" y="458" font-size="14" font-weight="600" fill="#F5F5F5">Final Report</text>
  </g>
</svg>
