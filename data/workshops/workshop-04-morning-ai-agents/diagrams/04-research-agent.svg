<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Research agent pipeline</title>
  <desc id="dg-desc">A user query goes to the research coordinator, which runs four steps — plan, search with the web search tool, read with the URL reader, and synthesise with the report formatter — producing a final markdown report.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="456" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">RESEARCH AGENT — PIPELINE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- top row -->
  <g text-anchor="middle">
    <rect x="144" y="104" width="192" height="72" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="240" y="136" font-size="15" font-weight="600" fill="#F5F5F5">User Query</text>
    <text x="240" y="158" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">research question</text>

    <rect x="496" y="104" width="224" height="72" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="608" y="136" font-size="15" font-weight="600" fill="#F5F5F5">Research Coordinator</text>
    <text x="608" y="158" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">drives all four steps</text>
  </g>

  <!-- step row -->
  <g text-anchor="middle">
    <rect x="48" y="240" width="192" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="276" font-size="14" font-weight="600" fill="#F5F5F5">1 · Plan</text>
    <text x="144" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">outline the research</text>

    <rect x="272" y="240" width="192" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="276" font-size="14" font-weight="600" fill="#F5F5F5">2 · Search</text>
    <text x="368" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">web search tool</text>

    <rect x="496" y="240" width="192" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="276" font-size="14" font-weight="600" fill="#F5F5F5">3 · Read</text>
    <text x="592" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">URL reader tool</text>

    <rect x="720" y="240" width="192" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="816" y="276" font-size="14" font-weight="600" fill="#F5F5F5">4 · Synthesise</text>
    <text x="816" y="300" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">report formatter</text>
  </g>

  <!-- report -->
  <g text-anchor="middle">
    <rect x="384" y="376" width="224" height="72" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="496" y="408" font-size="15" font-weight="600" fill="#F5F5F5">Final Report</text>
    <text x="496" y="430" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">markdown</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M336,140 L492,140" marker-end="url(#arr)"/>
    <path d="M540,176 C440,208 240,204 176,236" marker-end="url(#arr)"/>
    <path d="M240,284 L268,284" marker-end="url(#arr)"/>
    <path d="M464,284 L492,284" marker-end="url(#arr)"/>
    <path d="M688,284 L716,284" marker-end="url(#arr)"/>
    <path d="M816,328 C816,356 600,352 556,372" marker-end="url(#arr)"/>
  </g>
</svg>
