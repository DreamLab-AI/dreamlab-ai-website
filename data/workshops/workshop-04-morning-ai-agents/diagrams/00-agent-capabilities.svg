<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">What makes an AI agent</title>
  <desc id="dg-desc">Four capability pillars of an AI agent: reasoning, tool use, memory and autonomy, each with its key techniques.</desc>

  <!-- container -->
  <rect x="8" y="8" width="944" height="272" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">AI AGENT — FOUR CAPABILITIES</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- pillar cards -->
  <g text-anchor="middle">
    <rect x="48" y="104" width="192" height="152" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Reasoning</text>
    <text x="144" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">chain-of-thought</text>
    <text x="144" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">planning</text>
    <text x="144" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">self-reflection</text>

    <rect x="272" y="104" width="192" height="152" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="368" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Tool Use</text>
    <text x="368" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">MCP servers</text>
    <text x="368" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">function calling</text>
    <text x="368" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">code execution</text>

    <rect x="496" y="104" width="192" height="152" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Memory</text>
    <text x="592" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">context window</text>
    <text x="592" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">CLAUDE.md config</text>
    <text x="592" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">vector retrieval</text>

    <rect x="720" y="104" width="192" height="152" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="816" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Autonomy</text>
    <text x="816" y="168" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">subagent delegation</text>
    <text x="816" y="192" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">error recovery</text>
    <text x="816" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">goal pursuit</text>
  </g>
</svg>
