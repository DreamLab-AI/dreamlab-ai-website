<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" role="img" aria-labelledby="dg-title dg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="dg-title">Evolution of AI systems</title>
  <desc id="dg-desc">Timeline from static models (2020 to 2022), through chat interfaces (2023) and early agents (2024), to production agents with MCP and subagent orchestration (2025 to 2026).</desc>

  <!-- container -->
  <rect x="8" y="8" width="944" height="288" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">EVOLUTION OF AI SYSTEMS</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- spine -->
  <line x1="48" y1="120" x2="912" y2="120" stroke="rgba(255,255,255,0.15)"/>
  <g fill="#111827" stroke="#9CA3AF" stroke-width="1.2">
    <circle cx="144" cy="120" r="4"/>
    <circle cx="368" cy="120" r="4"/>
    <circle cx="592" cy="120" r="4"/>
    <circle cx="816" cy="120" r="4" stroke="#F59E0B"/>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">
    <text x="144" y="104">2020–22</text>
    <text x="368" y="104">2023</text>
    <text x="592" y="104">2024</text>
    <text x="816" y="104" fill="#F59E0B">2025–26</text>
  </g>

  <!-- era cards -->
  <g text-anchor="middle">
    <rect x="48" y="144" width="192" height="112" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="144" y="184" font-size="15" font-weight="600" fill="#F5F5F5">Static Models</text>
    <text x="144" y="208" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">GPT-3 · BERT</text>
    <text x="144" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">fixed responses</text>

    <rect x="272" y="144" width="192" height="112" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="368" y="184" font-size="15" font-weight="600" fill="#F5F5F5">Chat Interfaces</text>
    <text x="368" y="208" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">ChatGPT · Claude</text>
    <text x="368" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">conversational AI</text>

    <rect x="496" y="144" width="192" height="112" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="592" y="184" font-size="15" font-weight="600" fill="#F5F5F5">Early Agents</text>
    <text x="592" y="208" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">tool use · planning</text>
    <text x="592" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">multi-step reasoning</text>

    <rect x="720" y="144" width="192" height="112" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="816" y="184" font-size="15" font-weight="600" fill="#F5F5F5">Production Agents</text>
    <text x="816" y="208" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">MCP · Claude Code</text>
    <text x="816" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">subagent orchestration</text>
  </g>
</svg>
