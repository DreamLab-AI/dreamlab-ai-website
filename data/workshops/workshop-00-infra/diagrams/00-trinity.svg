<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="tri-title tri-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="tri-title">The modern development trinity</title>
  <desc id="tri-desc">Git and GitHub, VS Code with WSL2, and AI assistants exchange work in both directions and combine into one integrated workflow.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="344" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THE MODERN DEVELOPMENT TRINITY</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- three peers -->
  <g text-anchor="middle">
    <rect x="80" y="104" width="208" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="184" y="142" font-size="15" font-weight="600" fill="#F5F5F5">Git &amp; GitHub</text>
    <text x="184" y="166" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">safety net · portfolio</text>

    <rect x="376" y="104" width="208" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="142" font-size="15" font-weight="600" fill="#F5F5F5">VS Code + WSL2</text>
    <text x="480" y="166" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">command centre</text>

    <rect x="672" y="104" width="208" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="776" y="142" font-size="15" font-weight="600" fill="#F5F5F5">AI Assistants</text>
    <text x="776" y="166" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">development multiplier</text>
  </g>

  <!-- bidirectional links between peers -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M296,148 L368,148" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M592,148 L664,148" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>

  <!-- convergence -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M184,192 C184,244 384,240 420,264" marker-end="url(#arr)"/>
    <path d="M480,192 C480,224 480,232 480,252" marker-end="url(#arr)"/>
    <path d="M776,192 C776,244 576,240 540,264" marker-end="url(#arr)"/>
  </g>

  <!-- focal -->
  <g text-anchor="middle">
    <rect x="352" y="260" width="256" height="72" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="292" font-size="16" font-weight="600" fill="#F5F5F5">All working together</text>
    <text x="480" y="316" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">one integrated workflow</text>
  </g>
</svg>
