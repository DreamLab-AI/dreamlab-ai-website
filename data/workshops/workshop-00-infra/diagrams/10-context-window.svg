<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="ctx-title ctx-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ctx-title">The context window</title>
  <desc id="ctx-desc">System context, conversation history and files read this session all accumulate inside the roughly 200k-token context window, and all of it is sent with every single message.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="384" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">CONTEXT WINDOW (~200K TOKENS)</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <g text-anchor="middle">
    <rect x="48" y="104" width="264" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="180" y="150" font-size="15" font-weight="600" fill="#F5F5F5">System Context</text>
    <text x="180" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">CLAUDE.md, tool defs</text>

    <rect x="336" y="104" width="264" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="468" y="150" font-size="15" font-weight="600" fill="#F5F5F5">Conversation History</text>
    <text x="468" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">grows every turn</text>

    <rect x="624" y="104" width="264" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="756" y="150" font-size="15" font-weight="600" fill="#F5F5F5">Files Read</text>
    <text x="756" y="172" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">grows as you work</text>
  </g>

  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M180,224 C180,260 400,264 440,290" marker-end="url(#arr)"/>
    <path d="M468,224 C468,256 472,264 476,286" marker-end="url(#arr)"/>
    <path d="M756,224 C756,260 540,264 500,290" marker-end="url(#arr)"/>
  </g>

  <g text-anchor="middle">
    <rect x="360" y="296" width="240" height="64" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="324" font-size="16" font-weight="600" fill="#F5F5F5">Every Single Message</text>
    <text x="480" y="346" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">cost scales with size</text>
  </g>
</svg>
