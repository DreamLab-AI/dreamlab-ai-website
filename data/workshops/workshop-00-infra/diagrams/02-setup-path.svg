<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="sp-title sp-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="sp-title">Setup workflow</title>
  <desc id="sp-desc">Five setup steps — GitHub account, Git, VS Code with extensions, AI access, Claude Code — leading to a ready-to-code environment.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="324" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">SETUP WORKFLOW</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- top row: steps 1-3 -->
  <g text-anchor="middle">
    <rect x="64" y="104" width="240" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="184" y="138" font-size="15" font-weight="600" fill="#F5F5F5">GitHub account</text>
    <text x="184" y="162" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">2a · cloud</text>

    <rect x="360" y="104" width="240" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="138" font-size="15" font-weight="600" fill="#F5F5F5">Install Git</text>
    <text x="480" y="162" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">2b · local</text>

    <rect x="656" y="104" width="240" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="776" y="138" font-size="15" font-weight="600" fill="#F5F5F5">VS Code + extensions</text>
    <text x="776" y="162" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">2b · local</text>
  </g>

  <!-- bottom row: steps 4-5 + focal -->
  <g text-anchor="middle">
    <rect x="64" y="228" width="240" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="184" y="262" font-size="15" font-weight="600" fill="#F5F5F5">Set up AI access</text>
    <text x="184" y="286" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">2c · cloud</text>

    <rect x="360" y="228" width="240" height="80" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="480" y="262" font-size="15" font-weight="600" fill="#F5F5F5">Configure Claude Code</text>
    <text x="480" y="286" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">2d · local + extras</text>

    <rect x="656" y="228" width="240" height="80" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="776" y="262" font-size="15" font-weight="600" fill="#F5F5F5">Setup complete</text>
    <text x="776" y="286" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">ready to code</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M304,144 L352,144" marker-end="url(#arr)"/>
    <path d="M600,144 L648,144" marker-end="url(#arr)"/>
    <path d="M776,184 C776,208 260,196 196,220" marker-end="url(#arr)"/>
    <path d="M304,268 L352,268" marker-end="url(#arr)"/>
    <path d="M600,268 L648,268" marker-end="url(#arr)"/>
  </g>
</svg>
