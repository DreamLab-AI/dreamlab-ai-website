<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="bt1-title bt1-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="bt1-title">Time travel for code: branch and merge</title>
  <desc id="bt1-desc">Commits move left to right along main; an experiment branch splits off, gets two commits, and merges back before the v1.0 release.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="284" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">TIME TRAVEL FOR CODE</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- lane labels -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
    <text x="48" y="216" fill="#9CA3AF">main</text>
    <text x="48" y="128" fill="#F59E0B">experiment</text>
  </g>

  <!-- main line -->
  <path d="M120,212 L880,212" stroke="rgba(255,255,255,0.28)" stroke-width="1.2" fill="none"/>
  <!-- branch line: split after commit 2, merge before release -->
  <path d="M280,212 C320,212 320,124 360,124 L600,124 C640,124 640,212 680,212" stroke="#F59E0B" stroke-width="1.2" fill="none"/>

  <!-- main commits -->
  <g fill="#111827" stroke="#9CA3AF" stroke-width="1.2">
    <circle cx="160" cy="212" r="6"/>
    <circle cx="280" cy="212" r="6"/>
    <circle cx="520" cy="212" r="6"/>
    <circle cx="680" cy="212" r="6"/>
  </g>
  <circle cx="800" cy="212" r="6" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>

  <!-- experiment commits -->
  <g fill="#111827" stroke="#F59E0B" stroke-width="1.2">
    <circle cx="400" cy="124" r="6"/>
    <circle cx="560" cy="124" r="6"/>
  </g>

  <!-- commit labels -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#9CA3AF" text-anchor="middle">
    <text x="160" y="240">initial setup</text>
    <text x="280" y="240">basic features</text>
    <text x="520" y="240">fix bug in main</text>
    <text x="680" y="240">merge experiment</text>
    <text x="400" y="104">try new approach</text>
    <text x="560" y="104">refine feature</text>
  </g>
  <text x="800" y="240" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#F59E0B" text-anchor="middle">release v1.0</text>
</svg>
