<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="fvp-title fvp-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fvp-title">Free tools versus paid options</title>
  <desc id="fvp-desc">The core toolkit — GitHub free plan, VS Code, Git and GitHub Pages — costs nothing; Copilot, the Claude API and Cursor are optional paid extras.</desc>

  <!-- container -->
  <rect x="8" y="8" width="944" height="284" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">THE FREE (OR NEARLY FREE) ECOSYSTEM</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- Free (focal) -->
  <g>
    <rect x="48" y="96" width="416" height="164" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="72" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#F59E0B">FREE — EVERYTHING YOU NEED</text>
    <g font-size="14" font-weight="600" fill="#F5F5F5">
      <text x="72" y="160">GitHub Free plan</text>
      <text x="72" y="188">VS Code</text>
      <text x="272" y="160">Git</text>
      <text x="272" y="188">GitHub Pages</text>
    </g>
    <text x="72" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">unlimited repos · Actions · free hosting</text>
  </g>

  <!-- Paid (optional, dashed) -->
  <g>
    <rect x="496" y="96" width="416" height="164" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.20)" stroke-dasharray="4 3"/>
    <text x="520" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.12em" fill="#9CA3AF">PAID — OPTIONAL EXTRAS</text>
    <g font-size="14" font-weight="600" fill="#F5F5F5">
      <text x="520" y="160">GitHub Copilot</text>
      <text x="520" y="188">Claude API</text>
      <text x="520" y="216">Cursor</text>
    </g>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">
      <text x="700" y="160">$10/mo (free for students)</text>
      <text x="700" y="188">pay-as-you-go</text>
      <text x="700" y="216">$20/mo</text>
    </g>
  </g>
</svg>
