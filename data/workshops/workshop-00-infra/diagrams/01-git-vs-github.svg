<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="gvg-title gvg-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="gvg-title">Git versus GitHub</title>
  <desc id="gvg-desc">Git is local version-control software on your computer; GitHub is a cloud platform built on Git that adds collaboration, GitHub Pages, Actions and issue tracking, linked by push and pull.</desc>

  <defs>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="304" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">GIT VS GITHUB</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- nodes -->
  <g text-anchor="middle">
    <rect x="48" y="104" width="360" height="140" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="228" y="140" font-size="15" font-weight="600" fill="#F5F5F5">Git (Local)</text>
    <text x="228" y="162" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Version control software</text>
    <text x="228" y="182" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Runs on your computer</text>
    <text x="228" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Works fully offline</text>

    <rect x="552" y="104" width="360" height="140" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="732" y="140" font-size="15" font-weight="600" fill="#F5F5F5">GitHub (Cloud)</text>
    <text x="732" y="162" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">Remote hosting + features</text>
    <text x="732" y="182" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Collaboration · Pages</text>
    <text x="732" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">Actions (CI/CD) · Issues</text>
  </g>

  <!-- push / pull -->
  <path d="M408,130 L552,130" fill="none" stroke="#38BDF8" stroke-width="1.2" marker-end="url(#arr-sky)"/>
  <path d="M552,186 L408,186" fill="none" stroke="#38BDF8" stroke-width="1.2" marker-end="url(#arr-sky)"/>
  <text x="480" y="124" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#38BDF8" text-anchor="middle">push</text>
  <text x="480" y="200" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#38BDF8" text-anchor="middle">pull</text>

  <text x="480" y="280" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#6B7280" text-anchor="middle">Git works alone; GitHub is one host built on top of it</text>
</svg>
