<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="brm-title brm-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="brm-title">Branching model: one shared repository</title>
  <desc id="brm-desc">Two collaborators clone the shared GitHub repository, work on their own branches locally, push those branches up, and merge via pull requests.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="364" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">BRANCHING MODEL — SHARED REPOSITORY</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- shared repo (focal) -->
  <g text-anchor="middle">
    <rect x="360" y="104" width="240" height="84" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="480" y="140" font-size="16" font-weight="600" fill="#F5F5F5">Shared GitHub repo</text>
    <text x="480" y="164" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">branches merge via pull request</text>
  </g>

  <!-- locals -->
  <g text-anchor="middle">
    <rect x="96" y="264" width="240" height="84" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="216" y="300" font-size="15" font-weight="600" fill="#F5F5F5">User A — local clone</text>
    <text x="216" y="324" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">works on branch-A</text>

    <rect x="624" y="264" width="240" height="84" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="744" y="300" font-size="15" font-weight="600" fill="#F5F5F5">User B — local clone</text>
    <text x="744" y="324" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">works on branch-B</text>
  </g>

  <!-- arrows: clone/pull down, push up -->
  <g fill="none" stroke="#38BDF8" stroke-width="1.2">
    <path d="M400,188 C336,220 240,224 200,256" marker-end="url(#arr-sky)"/>
    <path d="M560,188 C624,220 720,224 760,256" marker-end="url(#arr-sky)"/>
  </g>
  <g fill="none" stroke="#9CA3AF" stroke-width="1.2">
    <path d="M248,256 C288,220 376,216 416,196" marker-end="url(#arr)"/>
    <path d="M712,256 C672,220 584,216 544,196" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10">
    <text x="200" y="216" fill="#38BDF8" text-anchor="end">clone / pull</text>
    <text x="352" y="244" fill="#9CA3AF">push branch-A</text>
    <text x="760" y="216" fill="#38BDF8">clone / pull</text>
    <text x="608" y="244" fill="#9CA3AF" text-anchor="end">push branch-B</text>
  </g>
</svg>
