<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="fkm-title fkm-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fkm-title">Forking model: contributing to an external repository</title>
  <desc id="fkm-desc">A contributor forks the upstream repository, clones the fork locally, pushes a feature branch back to the fork, and opens a pull request to upstream.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-sky" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- container -->
  <rect x="8" y="8" width="944" height="304" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.18em" fill="#9CA3AF">FORKING MODEL — EXTERNAL CONTRIBUTION</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="rgba(255,255,255,0.10)"/>

  <!-- nodes -->
  <g text-anchor="middle">
    <rect x="64" y="120" width="240" height="88" rx="8" fill="rgba(245,158,11,0.08)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="184" y="156" font-size="15" font-weight="600" fill="#F5F5F5">Upstream repo</text>
    <text x="184" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#F59E0B">the original project</text>

    <rect x="376" y="120" width="224" height="88" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.35)"/>
    <text x="488" y="156" font-size="15" font-weight="600" fill="#F5F5F5">Your fork</text>
    <text x="488" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">your copy on GitHub</text>

    <rect x="672" y="120" width="224" height="88" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.28)"/>
    <text x="784" y="156" font-size="15" font-weight="600" fill="#F5F5F5">Local clone</text>
    <text x="784" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9CA3AF">new-feature branch</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#38BDF8" stroke-width="1.2">
    <path d="M304,144 L368,144" marker-end="url(#arr-sky)"/>
    <path d="M600,144 L664,144" marker-end="url(#arr-sky)"/>
    <path d="M784,208 C784,264 560,264 512,216" marker-end="url(#arr-sky)"/>
  </g>
  <path d="M456,216 C408,264 232,264 184,216" fill="none" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" text-anchor="middle">
    <text x="336" y="132" fill="#38BDF8">fork</text>
    <text x="632" y="132" fill="#38BDF8">clone</text>
    <text x="648" y="264" fill="#38BDF8">push new-feature</text>
    <text x="320" y="264" fill="#9CA3AF">pull request to upstream main</text>
  </g>
</svg>
